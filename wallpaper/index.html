<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wallpaper Reminder</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#0b3d2e">
<style>
:root{--bg:#0e1117;--card:#171b24;--line:#2a3040;--text:#eef1f7;--mute:#8b93a7;--accent:#ffd24a;}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;}
.wrap{max-width:900px;margin:0 auto;padding:20px 16px 40px;display:grid;gap:18px;grid-template-columns:1fr;}
@media(min-width:760px){.wrap{grid-template-columns:1fr 300px;align-items:start;}}
h1{font-size:22px;margin:0 0 4px;}
p.sub{margin:0 0 14px;color:var(--mute);font-size:14px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:12px;}
label{font-size:12px;color:var(--mute);letter-spacing:.06em;text-transform:uppercase;display:grid;gap:6px;}
textarea,input,select{background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:11px 12px;font-size:16px;font-family:inherit;width:100%;}
textarea{min-height:130px;resize:vertical;}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.themes{display:flex;gap:8px;flex-wrap:wrap;}
.themes button{width:44px;height:44px;border-radius:12px;border:2px solid transparent;cursor:pointer;}
.themes button.on{border-color:#fff;}
button.go{background:var(--accent);color:#231a00;font-weight:700;border:0;border-radius:12px;padding:14px;font-size:16px;cursor:pointer;}
.row{align-items:end;}
button.add{background:var(--accent);color:#231a00;font-weight:700;border:0;border-radius:10px;padding:11px;font-size:16px;cursor:pointer;}
.events{display:grid;gap:8px;}
.ev{display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;}
.ev .t{flex:1;font-size:15px;font-weight:600;}
.ev .t small{display:block;color:var(--mute);font-weight:400;font-size:12px;margin-top:2px;}
.ev button{background:#1f8a5b;color:#fff;border:0;border-radius:9px;padding:8px 12px;font-size:13px;font-weight:700;cursor:pointer;}
.none{color:var(--mute);font-size:13px;text-align:center;padding:6px 0;}
.prev{display:grid;place-items:center;}
canvas{width:100%;max-width:280px;aspect-ratio:9/20;border-radius:26px;border:2px solid var(--line);background:#000;}
.hint{font-size:13px;color:var(--mute);line-height:1.5;}
</style>
</head>
<body>
<div class="wrap">
  <div>
    <h1>Wallpaper Reminder</h1>
    <p class="sub">Reminder tampil seperti notifikasi di lock screen.</p>
    <div class="card">
      <label>Event baru
        <input id="evTitle" placeholder="Nama event, mis. PDL Indogrosir" maxlength="80">
      </label>
      <div class="row">
        <label>Tanggal
          <input id="evDate" type="date">
        </label>
        <button class="add" id="evAdd" type="button">+ Tambah</button>
      </div>
      <div class="events" id="events"></div>
      <label>Posisi kartu
        <select id="pos"><option value="0.41">Tepat di bawah jam</option><option value="0.5">Agak ke bawah</option></select>
      </label>
      <label>Warna latar
        <div class="themes" id="themes"></div>
      </label>
      <button class="go" id="dl">Unduh PNG</button>
      <div class="hint">Android: buka file hasil unduhan di Galeri → ⋮ → <b>Setel sebagai wallpaper</b> → <b>Layar kunci</b>. Jam besar HP tampil di atas (sampai sekitar 38% layar), kartu ditaruh di bawahnya.</div>
    </div>
  </div>
  <div class="prev"><canvas id="cv" width="1080" height="2400"></canvas></div>
</div>

<script>
const THEMES = [
  {bg:['#0b3d2e','#1f8a5b'], blobs:['#7dffb2','#d4ff8a']},
  {bg:['#134e5e','#71b280'], blobs:['#c6ffdd','#8affd0']},
  {bg:['#052e1c','#0f6b3f'], blobs:['#34d399','#a7f3d0']},
  {bg:['#1b4332','#52b788'], blobs:['#d8f3dc','#95d5b2']},
  {bg:['#14532d','#4ade80'], blobs:['#bbf7d0','#facc15']},
  {bg:['#022c22','#115e59'], blobs:['#5eead4','#86efac']}
];
let theme = 0;
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
const FONT = "system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif";

$('themes').innerHTML = THEMES.map((t,i)=>`<button data-i="${i}" style="background:linear-gradient(135deg,${t.bg[0]},${t.bg[1]})" class="${i===0?'on':''}" aria-label="Tema ${i+1}"></button>`).join('');
$('themes').addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  theme = +b.dataset.i;
  document.querySelectorAll('#themes button').forEach(x=>x.classList.toggle('on', x===b));
  draw();
});

const BULAN = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
function fmtDate(v){
  const p = (v||'').split('-');
  return p.length===3 ? `${+p[2]} ${BULAN[+p[1]-1]} ${p[0]}` : '';
}
const todayISO = ()=>{
  const d = new Date(), z = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`;
};
$('evDate').value = todayISO();

const STORE_KEY = 'wp-events';
const DEFAULT_EVENTS = [
  {id:1, title:'SPG Event HPM Gorontalo', date:todayISO()},
  {id:2, title:'PDL Indogrosir', date:todayISO()},
  {id:3, title:'Hilo School Original Sejahtera Bulukumba', date:todayISO()}
];
let events;
try{
  const raw = localStorage.getItem(STORE_KEY);
  events = raw ? JSON.parse(raw) : DEFAULT_EVENTS;
}catch(e){ events = DEFAULT_EVENTS; }
function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(events)); }catch(e){} }
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function renderEvents(){
  $('events').innerHTML = events.length
    ? events.map(e=>`<div class="ev"><div class="t">${esc(e.title)}<small>${fmtDate(e.date)}</small></div><button data-id="${e.id}" type="button">✓ Selesai</button></div>`).join('')
    : '<div class="none">Tidak ada event. Wallpaper akan kosong.</div>';
}
function addEvent(){
  const title = $('evTitle').value.trim();
  if(!title){ $('evTitle').focus(); return; }
  events.push({id:Date.now(), title, date:$('evDate').value});
  $('evTitle').value = '';
  save(); renderEvents(); draw();
}
$('evAdd').addEventListener('click', addEvent);
$('evTitle').addEventListener('keydown', e=>{ if(e.key==='Enter') addEvent(); });
$('events').addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  events = events.filter(x=>x.id !== +b.dataset.id);
  save(); renderEvents(); draw();
});

// huruf pertama tiap kata jadi kapital; huruf lainnya dibiarkan sesuai ketikan
const capWords = s => s.replace(/(^|[\s(\/-])(\p{L})/gu, (m, p, c)=> p + c.toUpperCase());

function rr(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
function wrap(text, maxW){
  const words = text.split(/\s+/), lines = []; let cur = '';
  for(const w of words){
    const test = cur ? cur+' '+w : w;
    if(ctx.measureText(test).width > maxW && cur){ lines.push(cur); cur = w; } else cur = test;
  }
  if(cur) lines.push(cur);
  return lines;
}

function background(t){
  const W = cv.width, H = cv.height;
  const g = ctx.createLinearGradient(0,0,W,H);
  g.addColorStop(0,t.bg[0]); g.addColorStop(1,t.bg[1]);
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  [[0.15,0.2,700,t.blobs[0]],[0.9,0.75,800,t.blobs[1]]].forEach(([px,py,r,c])=>{
    const rg = ctx.createRadialGradient(W*px,H*py,0,W*px,H*py,r);
    rg.addColorStop(0,c+'cc'); rg.addColorStop(1,c+'00');
    ctx.fillStyle = rg; ctx.fillRect(0,0,W,H);
  });
}

function draw(){
  const t = THEMES[theme], W = cv.width, H = cv.height;
  background(t);

  // lebih dari 4 event: mode ringkas (tanggal sejajar di kanan judul)
  const compact = events.length > 4;
  const mx = 48, pad = compact ? 30 : 44, gap = compact ? 16 : 26, tlh = 66;
  const startY = H * +$('pos').value;
  const maxY = H * 0.9;

  // tata letak dalam koordinat "virtual" selebar 1/k kali kanvas, lalu diskalakan k
  function layout(k){
    const cw = (W - mx*2) / k;
    return {cw, cards: events.map(it=>{
      const when = fmtDate(it.date);
      ctx.font = `500 30px ${FONT}`;
      const dateW = compact && when ? ctx.measureText(when).width + 24 : 0;
      ctx.font = `700 52px ${FONT}`;
      const lines = wrap(capWords(it.title), cw - pad*2 - dateW);
      const dateH = !compact && when ? 50 : 0;
      return {when, lines, dateH, h: pad*2 + dateH + lines.length*tlh - 10};
    })};
  }
  const total = L => L.cards.reduce((s,c)=>s + c.h + gap, 0) - gap;

  let k = 1, L = layout(k);
  while(k > 0.4 && startY + total(L)*k > maxY){ k = Math.round((k - 0.02)*100)/100; L = layout(k); }

  ctx.save();
  ctx.scale(k, k);
  let y = startY / k;
  const x = mx / k, cw = L.cw;
  ctx.textBaseline = 'top'; ctx.textAlign = 'left';
  L.cards.forEach((c, i)=>{
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,.25)'; ctx.shadowBlur = 40; ctx.shadowOffsetY = 12;
    rr(x, y, cw, c.h, 58); ctx.fillStyle = 'rgba(255,255,255,.82)'; ctx.fill();
    ctx.restore();

    let cy = y + pad;
    if(c.when && compact){
      ctx.fillStyle = 'rgba(60,60,67,.75)'; ctx.font = `500 30px ${FONT}`;
      ctx.textAlign = 'right'; ctx.fillText(c.when, x+cw-pad, cy + 14); ctx.textAlign = 'left';
    } else if(c.when){
      ctx.fillStyle = 'rgba(60,60,67,.75)'; ctx.font = `500 34px ${FONT}`;
      ctx.fillText(c.when, x+pad, cy); cy += c.dateH;
    }
    ctx.fillStyle = '#000'; ctx.font = `700 52px ${FONT}`;
    c.lines.forEach(l=>{ ctx.fillText(l, x+pad, cy); cy += tlh; });
    y += c.h + gap;
  });
  ctx.restore();
}
$('pos').addEventListener('input', draw);

$('dl').addEventListener('click', ()=>{
  const a = document.createElement('a');
  a.download = 'wallpaper-reminder.png';
  a.href = cv.toDataURL('image/png');
  a.click();
});
renderEvents();
draw();

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js', {scope:'./'}).catch(()=>{});
}
</script>
</body>
</html>
