<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wallpaper Reminder</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#0c0e08">
<style>
:root{--bg:#0c0e08;--card:#151a0f;--card2:#1b2113;--line:rgba(200,232,78,.16);--text:#eef2e2;--mute:#8f9a7c;--accent:#c8e84e;--accent-ink:#12160a;--glow:#a8e33c;}
*{box-sizing:border-box;}
html,body{min-height:100%;}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;position:relative;overflow-x:hidden;}
body::before,body::after{content:"";position:fixed;border-radius:50%;filter:blur(70px);pointer-events:none;z-index:0;}
body::before{width:320px;height:320px;top:-110px;left:-80px;background:radial-gradient(circle at 40% 40%,var(--glow),transparent 70%);opacity:.55;}
body::after{width:440px;height:440px;bottom:-160px;right:-140px;background:radial-gradient(circle at 60% 60%,#c8e84e,transparent 70%);opacity:.4;}
.wrap{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:28px 16px 48px;display:grid;gap:18px;grid-template-columns:1fr;}
@media(min-width:760px){.wrap{grid-template-columns:1fr 300px;align-items:start;}}
h1{font-size:26px;margin:0;font-weight:800;letter-spacing:-.02em;}
h1 .dot{color:var(--accent);}
p.sub{margin:6px 0 14px;color:var(--mute);font-size:14px;}
.card{background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:22px;padding:18px;display:grid;gap:14px;box-shadow:0 30px 70px -40px rgba(0,0,0,.95);}
label{font-size:11px;color:var(--mute);letter-spacing:.12em;text-transform:uppercase;display:grid;gap:8px;font-weight:600;}
textarea,input,select{background:rgba(0,0,0,.35);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:12px 13px;font-size:16px;font-family:inherit;width:100%;transition:border-color .15s,box-shadow .15s;}
textarea:focus,input:focus,select:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px rgba(200,232,78,.15);}
textarea{min-height:130px;resize:vertical;}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:end;}
.themes{display:flex;gap:8px;flex-wrap:wrap;}
.themes button{width:44px;height:44px;border-radius:12px;border:2px solid transparent;cursor:pointer;}
.themes button.on{border-color:var(--accent);}
button.go{background:var(--accent);color:var(--accent-ink);font-weight:800;border:0;border-radius:14px;padding:15px;font-size:16px;cursor:pointer;transition:transform .1s;}
button.go:active{transform:scale(.99);}
button.add{background:var(--accent);color:var(--accent-ink);font-weight:800;border:0;border-radius:12px;padding:12px;font-size:16px;cursor:pointer;}
.cal{background:rgba(0,0,0,.32);border:1px solid var(--line);border-radius:18px;padding:14px;}
.cal .hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.cal .hd b{font-size:16px;text-transform:capitalize;}
.cal .hd button{background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:10px;width:40px;height:36px;font-size:17px;cursor:pointer;}
.cal .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.cal .dow{font-size:11px;color:var(--accent);text-align:center;padding:6px 0;font-weight:700;text-transform:uppercase;letter-spacing:.04em;}
.cal .d{position:relative;aspect-ratio:1.2;border:0;border-radius:11px;background:transparent;color:var(--text);font-size:15px;cursor:pointer;}
.cal .d:hover{background:rgba(200,232,78,.1);}
.cal .d.today{box-shadow:inset 0 0 0 1.5px rgba(200,232,78,.5);}
.cal .d.sel{box-shadow:inset 0 0 0 2px var(--accent);color:var(--accent);font-weight:700;}
.cal .d.has::after{content:"";position:absolute;bottom:5px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--accent);}
.cal .d.blank{visibility:hidden;}
.events{display:grid;gap:8px;}
.ev{display:flex;align-items:center;gap:12px;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:14px;padding:11px 12px;}
.ev .day{flex:0 0 34px;width:34px;height:34px;display:grid;place-items:center;border-radius:10px;background:rgba(200,232,78,.14);color:var(--accent);font-weight:800;font-size:14px;}
.ev .t{flex:1;font-size:15px;font-weight:600;}
.ev .t small{display:block;color:var(--mute);font-weight:500;font-size:12px;margin-top:3px;}
.ev button{background:rgba(200,232,78,.12);color:var(--accent);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:700;cursor:pointer;}
.none{color:var(--mute);font-size:13px;text-align:center;padding:6px 0;}
button.go.alt{background:transparent;color:var(--text);border:1px solid var(--line);}
.prev{display:grid;place-items:center;}
canvas{width:100%;max-width:280px;aspect-ratio:9/20;border-radius:26px;border:1px solid var(--line);background:#000;box-shadow:0 0 70px -10px rgba(168,227,60,.35);}
.hint{font-size:13px;color:var(--mute);line-height:1.5;}
</style>
</head>
<body>
<div class="wrap">
  <div>
    <h1>Wallpaper Reminder<span class="dot">.</span></h1>
    <p class="sub">Reminder tampil seperti notifikasi di lock screen.</p>
    <div class="card">
      <label>Event baru
        <input id="evTitle" placeholder="Nama event, mis. PDL Indogrosir" maxlength="80">
      </label>
      <label>Tanggal (klik tanggalnya)</label>
      <input id="evDate" type="hidden">
      <div class="cal" id="cal"></div>
      <button class="add" id="evAdd" type="button">+ Tambah</button>
      <div class="events" id="events"></div>
      <label>Posisi kartu
        <select id="pos"><option value="0.41">Tepat di bawah jam</option><option value="0.5">Agak ke bawah</option></select>
      </label>
      <label>Warna latar
        <div class="themes" id="themes"></div>
      </label>
      <button class="go" id="share">Bagikan ke Galeri</button>
      <button class="go alt" id="dl">Unduh PNG</button>
      <div class="hint" id="shareMsg"></div>
      <div class="hint">Android: buka file hasil unduhan di Galeri → ⋮ → <b>Setel sebagai wallpaper</b> → <b>Layar kunci</b>. Jam besar HP tampil di atas (sampai sekitar 38% layar), kartu ditaruh di bawahnya.</div>
    </div>
  </div>
  <div class="prev"><canvas id="cv" width="1080" height="2400"></canvas></div>
</div>

<script>
const THEMES = [
  {bg:'#0c0e08', accent:'#c8e84e', b1:'#a8e33c', b2:'#c8e84e'},
  {bg:'#08110d', accent:'#7dffb2', b1:'#34d399', b2:'#7dffb2'},
  {bg:'#081112', accent:'#5eead4', b1:'#22d3ee', b2:'#5eead4'},
  {bg:'#100f07', accent:'#ffd24a', b1:'#f2c14e', b2:'#ffd24a'},
  {bg:'#0d0a0a', accent:'#ff9c6e', b1:'#ff7a59', b2:'#ffb27a'}
];
let theme = 0;
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
const FONT = "system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif";

$('themes').innerHTML = THEMES.map((t,i)=>`<button data-i="${i}" style="background:linear-gradient(135deg,${t.accent},${t.bg})" class="${i===0?'on':''}" aria-label="Tema ${i+1}"></button>`).join('');
$('themes').addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  theme = +b.dataset.i;
  document.querySelectorAll('#themes button').forEach(x=>x.classList.toggle('on', x===b));
  draw();
});

const BULAN = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const HARI = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
function fmtDate(v){
  const p = (v||'').split('-');
  if(p.length!==3) return '';
  const hari = HARI[new Date(+p[0], +p[1]-1, +p[2]).getDay()];
  return `${hari}, ${+p[2]} ${BULAN[+p[1]-1]} ${p[0]}`;
}
const todayISO = ()=>{
  const d = new Date(), z = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`;
};
$('evDate').value = todayISO();

// kalender sebulan: klik tanggal untuk memilih
const BULAN_PANJANG = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
let calY = +todayISO().slice(0,4), calM = +todayISO().slice(5,7) - 1;
function renderCal(){
  const z = n => String(n).padStart(2,'0');
  const sel = $('evDate').value, today = todayISO();
  const has = new Set(events.map(e=>e.date));
  const first = new Date(calY, calM, 1);
  const lead = (first.getDay() + 6) % 7;            // pekan mulai Senin
  const days = new Date(calY, calM + 1, 0).getDate();
  let h = `<div class="hd"><button type="button" data-nav="-1" aria-label="Bulan sebelumnya">‹</button><b>${BULAN_PANJANG[calM]} ${calY}</b><button type="button" data-nav="1" aria-label="Bulan berikutnya">›</button></div><div class="grid">`;
  h += ['Sen','Sel','Rab','Kam','Jum','Sab','Min'].map(d=>`<div class="dow">${d}</div>`).join('');
  h += '<span class="d blank"></span>'.repeat(lead);
  for(let d=1; d<=days; d++){
    const iso = `${calY}-${z(calM+1)}-${z(d)}`;
    h += `<button type="button" class="d${iso===sel?' sel':''}${iso===today?' today':''}${has.has(iso)?' has':''}" data-date="${iso}">${d}</button>`;
  }
  $('cal').innerHTML = h + '</div>';
}
$('cal').addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  if(b.dataset.nav){
    calM += +b.dataset.nav;
    if(calM < 0){ calM = 11; calY--; } else if(calM > 11){ calM = 0; calY++; }
  }else if(b.dataset.date){
    $('evDate').value = b.dataset.date;
  }
  renderCal();
});

const STORE_KEY = 'wp-events';
const DEFAULT_EVENTS = [
  {id:1, title:'SPG Event HPM Gorontalo', date:todayISO()},
  {id:2, title:'PDL Indogrosir', date:todayISO()},
  {id:3, title:'Hilo School Original Sejahtera Bulukumba', date:todayISO()}
];
let events;
try{
  const raw = localStorage.getItem(STORE_KEY);
  events = raw ? JSON.parse(raw) : DEFAULT_EVENTS;
}catch(e){ events = DEFAULT_EVENTS; }
function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(events)); }catch(e){} }
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// tanggal paling dekat di atas (paling urgent); tanpa tanggal di paling bawah
const byDate = () => [...events].sort((a,b)=> (a.date||'9999-99-99').localeCompare(b.date||'9999-99-99'));

function renderEvents(){
  renderCal();
  $('events').innerHTML = events.length
    ? byDate().map(e=>{
        const dd = (e.date||'').slice(8,10);
        return `<div class="ev"><div class="day">${dd ? +dd : '•'}</div><div class="t">${esc(e.title)}<small>${fmtDate(e.date)}</small></div><button data-id="${e.id}" type="button">✓ Selesai</button></div>`;
      }).join('')
    : '<div class="none">Tidak ada event. Wallpaper akan kosong.</div>';
}
function addEvent(){
  const title = $('evTitle').value.trim();
  if(!title){ $('evTitle').focus(); return; }
  events.push({id:Date.now(), title, date:$('evDate').value});
  $('evTitle').value = '';
  save(); renderEvents(); draw();
}
$('evAdd').addEventListener('click', addEvent);
$('evTitle').addEventListener('keydown', e=>{ if(e.key==='Enter') addEvent(); });
$('events').addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  events = events.filter(x=>x.id !== +b.dataset.id);
  save(); renderEvents(); draw();
});

// huruf pertama tiap kata jadi kapital; huruf lainnya dibiarkan sesuai ketikan
const capWords = s => s.replace(/(^|[\s(\/-])(\p{L})/gu, (m, p, c)=> p + c.toUpperCase());

function rr(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}

function hexA(hex,a){
  const n = parseInt(hex.slice(1),16), r = (n>>16)&255, g = (n>>8)&255, b = n&255;
  return `rgba(${r},${g},${b},${a})`;
}
function drawBg(t){
  const W = cv.width, H = cv.height;
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,t.bg); g.addColorStop(1,'#070906');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  const blobs = [[W*0.20,H*0.10,560,t.b1,0.55],[W*1.04,H*0.84,820,t.b2,0.5],[W*0.02,H*1.0,540,t.b1,0.32]];
  for(const [x,y,r,c,a] of blobs){
    const rg = ctx.createRadialGradient(x,y,0,x,y,r);
    rg.addColorStop(0,hexA(c,a)); rg.addColorStop(1,hexA(c,0));
    ctx.fillStyle = rg; ctx.fillRect(0,0,W,H);
  }
}
function weeksInMonth(y,m){
  const first = new Date(y,m,1), lead = (first.getDay()+6)%7, days = new Date(y,m+1,0).getDate();
  return Math.ceil((lead+days)/7);
}
function fitFont(text, maxW, weight, size){
  ctx.font = `${weight} ${size}px ${FONT}`;
  while(ctx.measureText(text).width > maxW && size > 18){ size -= 2; ctx.font = `${weight} ${size}px ${FONT}`; }
  return size;
}

function draw(){
  const t = THEMES[theme], W = cv.width, H = cv.height, mx = 80;
  drawBg(t);

  const today = todayISO();
  const list = byDate();
  const up = list.find(e=> e.date && e.date >= today);
  const base = (up && up.date) || today;
  const vy = +base.slice(0,4), vm = +base.slice(5,7) - 1;

  const startY = H * +$('pos').value, maxY = H * 0.93;

  const HEAD = 200, GAP1 = 36, CALPAD = 30, WDH = 48, CELLH = 80, GAP2 = 42, CHIPH = 96, CHIPGAP = 18;
  const rows = weeksInMonth(vy, vm);
  const calH = CALPAD*2 + WDH + rows*CELLH;
  const chipsH = list.length ? list.length*CHIPH + (list.length-1)*CHIPGAP : 0;
  const contentH = HEAD + GAP1 + calH + (list.length ? GAP2 + chipsH : 0);

  let k = Math.min(1, (maxY - startY) / contentH);
  if(k < 0.5) k = 0.5;
  const cw = (W - mx*2) / k;

  ctx.save();
  ctx.translate(mx, startY);
  ctx.scale(k, k);

  // ---- judul bulan ----
  ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'right';
  ctx.fillStyle = 'rgba(255,255,255,.8)'; ctx.font = `600 46px ${FONT}`;
  ctx.fillText(String(vy), cw, 46);
  ctx.textAlign = 'left';
  ctx.fillStyle = t.accent; ctx.font = `700 26px ${FONT}`;
  ctx.fillText((list.length ? list.length + ' ' : '') + 'PENGINGAT', 0, 42);

  ctx.textBaseline = 'top';
  ctx.fillStyle = '#ffffff'; ctx.font = `800 134px ${FONT}`;
  ctx.fillText(BULAN_PANJANG[vm].toLowerCase(), 0, 62);

  let y = HEAD + GAP1;

  // ---- kalender ----
  const colW = (cw - CALPAD*2)/7;
  ctx.save();
  rr(0, y, cw, calH, 40);
  ctx.fillStyle = 'rgba(10,12,7,.72)'; ctx.fill();
  ctx.strokeStyle = hexA(t.accent,.2); ctx.lineWidth = 2; ctx.stroke();
  ctx.restore();

  const DOW = ['SEN','SEL','RAB','KAM','JUM','SAB','MIN'];
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = t.accent; ctx.font = `700 24px ${FONT}`;
  DOW.forEach((d,i)=> ctx.fillText(d, CALPAD + colW*(i+0.5), y + CALPAD + WDH/2));

  const z = n => String(n).padStart(2,'0');
  const first = new Date(vy,vm,1), lead = (first.getDay()+6)%7, days = new Date(vy,vm+1,0).getDate();
  const has = new Set(list.map(e=>e.date));
  const gy = y + CALPAD + WDH;
  for(let d=1; d<=days; d++){
    const idx = lead + d - 1, r = Math.floor(idx/7), c = idx%7;
    const cx = CALPAD + colW*(c+0.5), cy = gy + CELLH*(r+0.5);
    const iso = `${vy}-${z(vm+1)}-${z(d)}`;
    const isToday = iso === today, isEv = has.has(iso);
    const bw = Math.min(colW, CELLH)*0.78;
    if(isToday){
      rr(cx-bw/2, cy-bw/2, bw, bw, 16);
      ctx.fillStyle = t.accent; ctx.fill();
      ctx.fillStyle = '#141708';
    }else{
      if(isEv){
        rr(cx-bw/2, cy-bw/2, bw, bw, 16);
        ctx.strokeStyle = hexA(t.accent,.85); ctx.lineWidth = 2.5; ctx.stroke();
      }
      ctx.fillStyle = isEv ? t.accent : 'rgba(255,255,255,.92)';
    }
    ctx.font = `${(isToday||isEv) ? '700' : '500'} 34px ${FONT}`;
    ctx.fillText(String(d), cx, cy+1);
  }
  y += calH;

  // ---- chip event ----
  if(list.length){
    y += GAP2;
    for(const e of list){
      ctx.save();
      rr(0, y, cw, CHIPH, 26);
      ctx.fillStyle = 'rgba(8,10,5,.72)'; ctx.fill();
      ctx.strokeStyle = hexA(t.accent,.22); ctx.lineWidth = 2; ctx.stroke();
      ctx.restore();

      const dd = e.date ? +e.date.slice(8,10) : null;
      rr(22, y+22, 52, 52, 16);
      ctx.fillStyle = t.accent; ctx.fill();
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = '#141708'; ctx.font = `800 30px ${FONT}`;
      ctx.fillText(dd ? String(dd) : '•', 48, y + CHIPH/2 + 1);

      const title = capWords(e.title);
      fitFont(title, cw - 22 - 52 - 24 - 24, '600', 36);
      ctx.textAlign = 'left'; ctx.fillStyle = '#f3f6ea';
      ctx.fillText(title, 22 + 52 + 24, y + CHIPH/2 + 1);

      y += CHIPH + CHIPGAP;
    }
  }

  ctx.restore();
}
$('pos').addEventListener('input', draw);

function download(){
  const a = document.createElement('a');
  a.download = 'wallpaper-reminder.png';
  a.href = cv.toDataURL('image/png');
  a.click();
}
$('dl').addEventListener('click', download);

$('share').addEventListener('click', ()=>{
  const msg = $('shareMsg');
  cv.toBlob(async blob=>{
    const file = new File([blob], 'wallpaper-reminder.png', {type:'image/png'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      try{
        await navigator.share({files:[file], title:'Wallpaper Reminder'});
        msg.textContent = 'Pilih Galeri/Foto, lalu ⋮ → Setel sebagai wallpaper → Layar kunci.';
      }catch(e){
        if(e.name !== 'AbortError') msg.textContent = 'Gagal membagikan: ' + e.message;
      }
    }else{
      msg.textContent = 'Browser ini tidak mendukung bagikan file, gambar diunduh saja.';
      download();
    }
  }, 'image/png');
});
renderEvents();
draw();

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js', {scope:'./'}).catch(()=>{});
}
</script>
</body>
</html>
