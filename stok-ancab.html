/* Item DOI rendah per cabang */
function lowItems(b){
  return S.rows.filter(r=>r.b===b&&(!S.active||r.st==="AKTIF")&&r.ap>0&&doi(r)<S.thr)
    .sort((x,y)=>S.sort==="doi"?doi(x)-doi(y)||y.ap-x.ap:y.ap-x.ap);
}

/* Hitung saran Ancab: hub Makassar, pengirim sisa >= keep hari, penerima +add hari */
function compute(){
  const g={};
  S.rows.filter(r=>r.st==="AKTIF").forEach(r=>{const k=r.code+"|"+r.sku;(g[k]=g[k]||{})[r.b]=r});
  const moves=[],unmet=[];
  Object.values(g).forEach(m=>{
    const sur={},sent={};
    Object.keys(m).forEach(b=>{const o=m[b];sur[b]=Math.max(0,Math.floor(o.ap>0?o.soh-o.ap*S.keep/30:o.soh));sent[b]=0});
    const recv=Object.keys(m).filter(b=>m[b].ap>0&&doi(m[b])<S.thr).sort((a,c)=>doi(m[a])-doi(m[c]));
    recv.forEach(b=>{
      const o=m[b];let need=Math.floor(o.ap*S.add/30),got=0;
      const srcs=(b==="MAKASSAR"?["BONE","PAREPARE","PALOPO"]:["MAKASSAR"]).filter(x=>m[x]&&x!==b).sort((x,y)=>sur[y]-sur[x]);
      srcs.forEach(sn=>{
        if(need<=0)return;const q=Math.min(need,sur[sn]);if(q<1)return;
        sur[sn]-=q;sent[sn]+=q;need-=q;got+=q;
        const sd=m[sn];
        moves.push({sku:o.sku,brand:o.brand,from:sn,to:b,q,sSoh:sd.soh,sAp:sd.ap,sInt:sd.int,sKey:sn+"|"+o.code+"|"+o.sku,
          rSoh:o.soh,rAp:o.ap,rInt:o.int,rBefore:doi(o)});
      });
      if(got<1)unmet.push({sku:o.sku,brand:o.brand,b,soh:o.soh,ap:o.ap,int:o.int,d:doi(o),
        why:b==="MAKASSAR"?"Bone, Parepare, Palopo tidak punya kelebihan":(m.MAKASSAR&&m.MAKASSAR.ap>0&&doi(m.MAKASSAR)<S.keep?"Makassar sendiri tipis":"Makassar tidak punya kelebihan")});
    });
  });
  const tot={};moves.forEach(x=>tot[x.sKey]=(tot[x.sKey]||0)+x.q);
  moves.forEach(x=>{
    x.sAfter=x.sAp>0?(x.sSoh-tot[x.sKey])/x.sAp*30:null;
    x.sBefore=x.sAp>0?x.sSoh/x.sAp*30:null;
    x.rAfter=(x.rSoh+x.q)/x.rAp*30;
  });
  return{moves,unmet};
}

function meter(d){const w=Math.min(100,d/60*100);return `<div class="meter" aria-hidden="true"><i style="width:${w}%;background:var(--${sev(d)})"></i><u style="left:50%"></u></div>`}
function intPill(int){return int>0?`<span class="pill">Intransit ${f0(int)} ctn</span>`:`<span class="pill muted">Tanpa intransit</span>`}

  const cnt=b=>S.rows.filter(r=>r.b===b);

  return `

  const cards=l.map(r=>{const d=doi(r);const out=r.soh<=0.05;
    return `<div class="card item"><div class="top"><div style="min-width:0"><div class="name">${esc(r.sku)}</div><div class="brand">${esc(r.brand)}${r.st!=="AKTIF"?` · ${esc(r.st)}`:""}</div></div>

      ${meter(d)}
      <div class="facts"><span>SOH <b>${f1(r.soh)}</b> ctn</span><span>AP3M <b>${f1(r.ap)}</b>/bln</span></div>
      <div class="row">${out?'<span class="pill crit">Stok habis</span>':""}${intPill(r.int)}</div></div>`}).join("");
  return `
  <h2>Item DOI rendah</h2>
  <div class="chips" role="group" aria-label="Cabang">${chips}</div>
  <div class="row" style="margin-block:12px">
    <label class="note" for="thr">DOI di bawah</label><input type="number" id="thr" value="${S.thr}" min="1" max="120" inputmode="numeric"><span class="note">hari</span>
    <select id="sort" aria-label="Urutkan"><option value="doi" ${S.sort==="doi"?"selected":""}>DOI terendah</option><option value="ap" ${S.sort==="ap"?"selected":""}>Penjualan terbesar</option></select>
    <label class="row note" style="gap:6px"><input type="checkbox" id="act" ${S.active?"checked":""}> Hanya aktif</label>
  </div>
  <div class="note" style="margin-bottom:10px">${l.length} item di ${BN[S.br]}. Garis hitam pada bar menandai 30 hari.</div>
  <div class="stack">${cards||'<div class="card empty">Tidak ada item di bawah batas ini.</div>'}</div>`;
}

function vAncab(){
  const {moves,unmet}=compute();
  const inn=moves.filter(m=>m.to===S.br),out=moves.filter(m=>m.from===S.br);
  const sum=a=>a.reduce((s,x)=>s+x.q,0);
  const chips=BR.map(b=>`<button class="chip" data-br="${b}" aria-pressed="${b===S.br}">${BN[b]}<span class="n">${moves.filter(m=>m.to===b||m.from===b).length}</span></button>`).join("");
  const card=(m,dir)=>{
    const other=dir==="in"?m.from:m.to;
    const intNote=m.rInt>0?`<span class="pill warn">Penerima ada intransit ${f0(m.rInt)} ctn</span>`:`<span class="pill muted">Penerima tanpa intransit</span>`;
    const sNote=m.sAp>0?`<span>Pengirim DOI <b>${f0(m.sBefore)}→${f0(m.sAfter)}</b></span>`:`<span>Pengirim tanpa penjualan</span>`;
    return `<div class="card item"><div class="move"><div class="qty">${f0(m.q)}<small>CTN</small></div>
      <div style="min-width:0"><div class="name">${esc(m.sku)}</div>
      <div class="route">${dir==="in"?"Dari":"Ke"} <b>${BN[other]}</b></div></div></div>
      <div class="facts"><span>Penerima DOI <b>${f0(m.rBefore)}→${f0(m.rAfter)}</b></span>${sNote}</div>
      <div class="row">${intNote}${m.sInt>0?`<span class="pill muted">Pengirim ada intransit ${f0(m.sInt)}</span>`:""}</div></div>`};
  const um=unmet.filter(u=>u.b===S.br).sort((a,c)=>c.ap-a.ap).slice(0,12);
  const umHtml=um.map(u=>`<div class="card item"><div class="top"><div style="min-width:0"><div class="name">${esc(u.sku)}</div><div class="brand">${esc(u.why)}</div></div><div class="doi ${sev(u.d)}">${u.soh<=0.05?"0":f0(u.d)}<small>HARI DOI</small></div></div>
    <div class="row">${intPill(u.int)}<span class="facts"><span>AP3M <b>${f1(u.ap)}</b>/bln</span></span></div></div>`).join("");
  return `
  <h2>Saran Ancab</h2>
  <div class="chips" role="group" aria-label="Cabang">${chips}</div>
  <div class="card" style="margin-block:12px"><div class="grid2">
    <div class="stat"><span class="v">${f0(sum(inn))}</span><span class="k">ctn diterima · ${inn.length} item</span></div>
    <div class="stat"><span class="v">${f0(sum(out))}</span><span class="k">ctn dikirim · ${out.length} item</span></div></div>
    <p class="note" style="margin:10px 0 0">Rute hanya Makassar ⇄ Bone, Parepare, Palopo. Pengirim tetap punya minimal <b>${S.keep}</b> hari, penerima ditambah maksimal <b>${S.add}</b> hari. Intransit tidak dihitung sebagai stok.</p>
    <div class="row" style="margin-top:10px">
      <label class="note" for="keep">Sisa pengirim</label><input type="number" id="keep" value="${S.keep}" min="0" max="120" inputmode="numeric">
      <label class="note" for="add">Tambah</label><input type="number" id="add" value="${S.add}" min="1" max="120" inputmode="numeric"><span class="note">hari</span></div></div>
  ${inn.length?`<div class="lbl" style="margin:16px 0 8px">Terima di ${BN[S.br]}</div><div class="stack">${inn.sort((a,c)=>c.q-a.q).map(m=>card(m,"in")).join("")}</div>`:""}
  ${out.length?`<div class="lbl" style="margin:16px 0 8px">Kirim dari ${BN[S.br]}</div><div class="stack">${out.sort((a,c)=>c.q-a.q).map(m=>card(m,"out")).join("")}</div>`:""}
  ${!inn.length&&!out.length?'<div class="card empty">Tidak ada Ancab untuk cabang ini.</div>':""}
  ${(inn.length||out.length)?`<button class="btn ghost" id="copy" style="margin-top:14px;width:100%">Salin ringkasan untuk WhatsApp</button>`:""}
  ${um.length?`<div class="lbl" style="margin:20px 0 8px">Belum tertutup Ancab</div><div class="stack">${umHtml}</div>`:""}`;
}

function render(){
  $("#stamp").textContent=S.label;
  $("#view").innerHTML=S.tab==="data"?vData():S.tab==="doi"?vDoi():vAncab();
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",t.dataset.tab===S.tab));
  window.scrollTo(0,0);
}
function refresh(){const y=window.scrollY;$("#stamp").textContent=S.label;$("#view").innerHTML=S.tab==="data"?vData():S.tab==="doi"?vDoi():vAncab();window.scrollTo(0,y)}

document.addEventListener("click",e=>{
  const t=e.target.closest(".tab");if(t){S.tab=t.dataset.tab;render();return}
  const c=e.target.closest(".chip");if(c){S.br=c.dataset.br;refresh();return}
  if(e.target.id==="reset"){location.reload();return}
  if(e.target.id==="copy"){
    const {moves}=compute();const L=[`Ancab ${BN[S.br]} (data ${S.label})`];
    const inn=moves.filter(m=>m.to===S.br),out=moves.filter(m=>m.from===S.br);
    if(inn.length){L.push("","TERIMA:");inn.forEach(m=>L.push(`- ${m.sku}: ${f0(m.q)} ctn dari ${BN[m.from]}`))}
    if(out.length){L.push("","KIRIM:");out.forEach(m=>L.push(`- ${m.sku}: ${f0(m.q)} ctn ke ${BN[m.to]}`))}
    const txt=L.join("\n");
    (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast("Ringkasan tersalin")).catch(()=>{const ta=document.createElement("textarea");ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");toast("Ringkasan tersalin")}catch(x){toast("Gagal menyalin")}ta.remove()});
  }
});
document.addEventListener("change",e=>{
  const id=e.target.id;
  if(id==="thr"){S.thr=Math.max(1,+e.target.value||30);refresh()}
  else if(id==="sort"){S.sort=e.target.value;refresh()}
  else if(id==="act"){S.active=e.target.checked;refresh()}
  else if(id==="keep"){S.keep=Math.max(0,+e.target.value||0);refresh()}
  else if(id==="add"){S.add=Math.max(1,+e.target.value||30);refresh()}
  else if(id==="file"){loadFile(e.target.files[0])}
});

async function loadFile(f){
  const msg=$("#msg");if(!f)return;
  if(typeof XLSX==="undefined"){msg.textContent="Pembaca Excel belum termuat. Cek koneksi lalu muat ulang halaman.";return}
  msg.textContent="Membaca "+f.name+" ...";
  try{
    const buf=await f.arrayBuffer();
    let wb=XLSX.read(buf,{type:"array",sheets:"Update Stock"});
    let ws=wb.Sheets["Update Stock"];
    if(!ws){wb=XLSX.read(buf,{type:"array"});ws=wb.Sheets["Update Stock"]}
    if(!ws){msg.textContent="Sheet 'Update Stock' tidak ditemukan di file ini.";return}
    const a=XLSX.utils.sheet_to_json(ws,{header:1,defval:null,raw:true});
    const map={"MAKASSAR":"MAKASSAR","BONE":"BONE","PARE-PARE":"PAREPARE","PAREPARE":"PAREPARE","PALOPO":"PALOPO"};
    const rows=[];
    a.forEach(r=>{const b=map[String(r[1]||"").trim().toUpperCase()];
      if(b&&String(r[2]||"").trim().toUpperCase()==="TRADITIONAL")
        rows.push({b,code:String(r[4]||""),sku:String(r[6]||"").trim(),brand:String(r[3]||"").trim(),st:String(r[7]||"").trim().toUpperCase(),
          soh:+r[11]||0,int:+r[13]||0,ap:+r[23]||0})});
    if(!rows.length){msg.textContent="Tidak ada baris Traditional untuk 4 cabang. Pastikan ini file Update Stock Nutrifood.";return}
    let label=f.name.replace(/\.[^.]+$/,"");
    for(let i=0;i<5&&i<a.length;i++){const t=String(a[i][1]||"");const m=t.match(/Stock Nutrifood\s+(.+)/i);if(m){label=m[1].trim();break}}
    S.rows=rows;S.label=label;S.src=f.name;S.mod="diunggah";
    render();toast("Data "+label+" dimuat: "+rows.length+" baris");
  }catch(err){msg.textContent="Gagal membaca file: "+(err&&err.message?err.message:err)}
}
render();
/* Muat data terbaru hasil tarikan server (stok-data.json) */
(async function(){
  const set=t=>{const el=$("#auto");if(el)el.textContent=t};
  try{
    const r=await fetch("stok-data.json?t="+Date.now(),{cache:"no-store"});
    if(!r.ok)throw new Error(r.status);
    const j=await r.json();
    if(!j.rows||!j.rows.length)throw new Error("kosong");
    S.rows=j.rows.map(a=>({b:a[0],code:a[1],sku:a[2],brand:a[3],st:a[4],soh:a[5],int:a[6],ap:a[7]}));
    S.label=j.label;S.src=j.src;
    S.mod=new Date(j.modified).toLocaleString("id-ID",{timeZone:"Asia/Makassar",day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"})+" WITA";
    refresh();set("Data terbaru dimuat otomatis.");
  }catch(e){set("Pakai data bawaan "+SNAP.label+". Data otomatis belum tersedia.")}
})();
</script>
