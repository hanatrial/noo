}

[hidden]{display:none!important}
html{color-scheme:light dark}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:0 84px;-webkit-text-size-adjust:100%}
.wrap{max-width:640px;margin-inline:auto}

.segb{border:0;background:transparent;color:#B9C5CE;font:700 14px var(--f-display);letter-spacing:.1em;text-transform:uppercase;padding:6px 8px;min-height:36px;cursor:pointer}

header h1{font:700 26px/1 var(--f-display);margin:0;letter-spacing:.02em;text-transform:uppercase}
header .sub{font-size:12px;color:#A9B6C1;margin-top:4px}
.stamp{font:500 11px var(--f-mono);color:#A9B6C1;text-align:right;white-space:nowrap}
.stamp b{display:block;color:var(--on-graphite);font-weight:600;font-size:13px}
h2{font:700 20px var(--f-display);margin:22px 0 10px;letter-spacing:.04em;text-transform:uppercase}
.lbl{font:600 12px var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.btn{font:600 14px var(--f-body);border:0;border-radius:6px;padding:12px 16px;background:var(--accent);color:var(--accent-ink);cursor:pointer;min-height:46px;letter-spacing:.01em}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}

.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;padding:9px 14px;font:600 14px var(--f-body);cursor:pointer;min-height:42px}
.chip[aria-pressed="true"]{background:var(--graphite);color:var(--on-graphite);border-color:var(--graphite);box-shadow:inset 0 -3px 0 var(--rack)}
.chip .n{font:600 12px var(--f-mono);margin-left:7px;opacity:.8}
.pill{display:inline-block;font:600 11px var(--f-body);padding:3px 8px;border-radius:4px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}

.pill.muted{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.stat{display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .v{font:600 26px/1.1 var(--f-mono);font-variant-numeric:tabular-nums}
.stat .k{font-size:12px;color:var(--muted)}
.item{display:flex;flex-direction:column;gap:9px}
.item .top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}

.doi{flex:0 0 auto;min-width:66px;padding:7px 8px 6px;border-radius:4px;text-align:center;font:700 26px/1 var(--f-mono);font-variant-numeric:tabular-nums;color:#fff}

.route{font-size:12px;color:var(--muted)} .route b{color:var(--ink)}

.note{font-size:13px;color:var(--muted)}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px}
a{color:var(--accent)}
select,input[type=number]{font:500 14px var(--f-body);background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:6px;padding:9px 10px;min-height:42px}

.adv{border-top:1px dashed var(--line);padding-top:10px;display:flex;flex-direction:column;gap:10px;font-size:14px}
code{font-family:var(--f-mono);font-size:.9em}

/* Hitung saran Ancab menurut rute wilayah (Sulsel: hub Makassar; Manado-Gorontalo: Manado ke Gorontalo), pengirim sisa >= keep hari, penerima +add hari */
function compute(){
  const g={};
  rowsC().filter(r=>S.prun||r.st==="AKTIF").forEach(r=>{const k=r.code+"|"+r.sku;(g[k]=g[k]||{})[r.b]=r});
  const moves=[],unmet=[];
  Object.values(g).forEach(m=>{

      const srcs=allowed.filter(x=>m[x]).sort((x,y)=>sur[y]-sur[x]);
      srcs.forEach(sn=>{
        if(need<=0)return;const q=Math.min(need,sur[sn]);if(q<1)return;
        sur[sn]-=q;sent[sn]+=q;need-=q;got+=q;
        const sd=m[sn];
        moves.push({code:o.code,sku:o.sku,brand:o.brand,from:sn,to:b,q,sSoh:sd.soh,sAp:sd.ap,sInt:sd.int,sKey:sn+"|"+o.code+"|"+o.sku,
          rSoh:o.soh,rAp:o.ap,rInt:o.int,rBefore:doi(o)});
      });
      if(got<1)unmet.push({code:o.code,sku:o.sku,brand:o.brand,b,soh:o.soh,ap:o.ap,int:o.int,d:doi(o),
        why:allowed.map(x=>BN[x]).join(", ")+(allowed.length===1&&m[allowed[0]]&&m[allowed[0]].ap>0&&doi(m[allowed[0]])<S.keep?" sendiri tipis":" tidak punya kelebihan")});
    });
  });
  const tot={};moves.forEach(x=>tot[x.sKey]=(tot[x.sKey]||0)+x.q);
  moves.forEach(x=>{
    x.sAfter=x.sAp>0?(x.sSoh-tot[x.sKey])/x.sAp*30:null;
    x.sBefore=x.sAp>0?x.sSoh/x.sAp*30:null;
    x.rAfter=(x.rSoh+x.q)/x.rAp*30;
  });
  return{moves,unmet};
}

/* ---------- Tampilan ---------- */
function meter(d){const w=Math.min(100,d/60*100);return `<div class="meter" aria-hidden="true"><i style="width:${w}%;background:var(--${sev(d)})"></i><u style="left:50%"></u></div>`}
function intPill(int){return int>0?`<span class="pill">Intransit ${f0(int)} ctn</span>`:`<span class="pill muted">Tanpa intransit</span>`}

function vData(){
  const cnt=b=>rowsC().filter(r=>r.b===b);
  const tiles=LOWB().map(b=>{const l=lowItems(b);const z=l.filter(r=>r.soh<=0).length;
    return `<div class="card stat"><span class="k">${BN[b]}</span><span class="v">${l.length}</span><span class="k">item DOI &lt; ${S.thr} hari${z?` · ${z} kosong`:""}</span></div>`}).join("");
  return `
  <h2>Sumber data</h2>
  <div class="card stack">
    <div><div class="lbl">${S.mod==="diunggah"?"File yang dipilih":"File terbaru di Nextcloud"}</div><div style="font-weight:600;overflow-wrap:anywhere">${esc(S.src)}</div>
      <div class="note">${S.mod==="diunggah"?"Diunggah manual":"Modified "+esc(S.mod)} · ${rowsC().length} baris ${CN[S.cat]} (${BRS().length} cabang)</div></div>
    <button class="btn" id="pull" type="button">Tarik data terbaru</button>
    <div class="note" id="auto">Mengecek file terbaru ...</div>
    <label class="btn ghost" for="file" style="text-align:center;display:block">Atau pilih file dari HP (.xlsb / .xlsx)</label>
    <input type="file" id="file" accept=".xlsb,.xlsx,.xlsm" hidden>
    <div id="msg" class="note"></div>
    ${S.mod==="diunggah"?`<button class="btn ghost" id="reset">Kembali ke data bawaan (${esc(SNAP.label)})</button>`:""}
  </div>
  <h2>Cara tarik data terbaru</h2>
  <div class="card">
    <ol class="steps">
      <li>Server membaca folder <a href="${SHARE}" target="_blank" rel="noopener">NUTRIFOOD</a> tiap 10 menit pada jam kerja.</li>
      <li>File dengan kolom <b>Modified</b> paling baru yang dipakai, bukan yang namanya paling akhir.</li>
      <li>Hasilnya dimuat otomatis saat halaman dibuka. Pilih file manual hanya jika perlu data yang lebih baru dari itu.</li>
    </ol>
    <p class="note" style="margin:10px 0 0">Nextcloud tidak mengizinkan browser membaca langsung, jadi pembacaan dilakukan di server lalu disimpan sebagai <code>stok-data.json</code>.</p>
  </div>
  <h2>Ringkasan cepat</h2>
  <div class="grid2">${tiles}</div>
  <p class="note">Hitungan memakai item aktif dengan penjualan AP3M di atas 0.</p>`;
}

function advice(r,moves,unmet){
  const mv=moves.filter(m=>m.to===r.b&&m.code===r.code&&m.sku===r.sku);
  if(mv.length)return mv.map(m=>`<div><b>Ambil ${f0(m.q)} ctn dari ${BN[m.from]}</b><br><span class="note">DOI ${BN[m.to]} ${f0(m.rBefore)} → ${f0(m.rAfter)} hari · ${BN[m.from]} ${m.sAp>0?"DOI "+f0(m.sBefore)+" → "+f0(m.sAfter):"tanpa penjualan"} (stok ${f1(m.sSoh)} ctn)${m.rInt>0?" · penerima ada intransit "+f0(m.rInt)+" ctn":""}</span></div>`).join("");
  const u=unmet.find(x=>x.b===r.b&&x.code===r.code&&x.sku===r.sku);
  if(u)return `<div><b>Belum bisa diancab</b><br><span class="note">${esc(u.why)}.${r.int>0?" Ada intransit "+f0(r.int)+" ctn.":""}</span></div>`;
  if(r.st!=="AKTIF"&&!S.prun)return `<div><b>Tidak diancab</b><br><span class="note">Item ${esc(r.st)} tidak diikutkan. Nyalakan "Sertakan item PRUNNING" di tab Saran Ancab untuk memasukkannya.</span></div>`;
  return `<div><b>Tidak ada saran Ancab</b><br><span class="note">Tidak ada cabang pengirim yang diizinkan untuk item ini.</span></div>`;
}
function vDoi(){
  const l=lowItems(S.br);
  const {moves,unmet}=compute();
  const chips=LOWB().map(b=>`<button class="chip" data-br="${b}" aria-pressed="${b===S.br}">${BN[b]}<span class="n">${lowItems(b).length}</span></button>`).join("");
  const cards=l.map(r=>{const d=doi(r);const out=r.soh<=0.05;const k=r.code+"|"+r.sku;const op=!!S.open[k];
    return `<div class="card item tap" data-k="${esc(k)}" role="button" tabindex="0" aria-expanded="${op}"><div class="top"><div style="min-width:0"><div class="name">${esc(r.sku)}</div><div class="brand">${esc(r.brand)}${r.st!=="AKTIF"?` · ${esc(r.st)}`:""}</div></div>
      <div class="doi ${sev(d)}">${out?"0":f0(d)}<small>HARI DOI</small></div></div>
      ${meter(d)}
      <div class="facts"><span>SOH <b>${f1(r.soh)}</b> ctn</span><span>AP3M <b>${f1(r.ap)}</b>/bln</span></div>
      <div class="row">${out?'<span class="pill crit">Stok habis</span>':""}${intPill(r.int)}<span class="pill" style="margin-left:auto">Saran Ancab ${op?"▴":"▾"}</span></div>
      ${op?`<div class="adv">${advice(r,moves,unmet)}</div>`:""}</div>`}).join("");
  return `
  <h2>Item DOI rendah</h2>
  <div class="chips" role="group" aria-label="Cabang">${chips}</div>
  <div class="row" style="margin-block:12px">
    <label class="note" for="thr">DOI di bawah</label><input type="number" id="thr" value="${S.thr}" min="1" max="120" inputmode="numeric"><span class="note">hari</span>
    <select id="sort" aria-label="Urutkan"><option value="ap" ${S.sort==="ap"?"selected":""}>AP3M tertinggi</option><option value="doi" ${S.sort==="doi"?"selected":""}>DOI terendah</option></select>
    <label class="row note" style="gap:6px"><input type="checkbox" id="act" ${S.active?"checked":""}> Hanya aktif</label>
  </div>
  <div class="note" style="margin-bottom:10px">${l.length} item di ${BN[S.br]}. Garis hitam pada bar menandai 30 hari. Ketuk item untuk melihat saran Ancab.</div>
  <div class="stack">${cards||'<div class="card empty">Tidak ada item di bawah batas ini.</div>'}</div>`;
}

function vAncab(){
  const {moves,unmet}=compute();
  const inn=moves.filter(m=>m.to===S.br),out=moves.filter(m=>m.from===S.br);
  const sum=a=>a.reduce((s,x)=>s+x.q,0);
  const chips=BRS().map(b=>`<button class="chip" data-br="${b}" aria-pressed="${b===S.br}">${BN[b]}<span class="n">${moves.filter(m=>m.to===b||m.from===b).length}</span></button>`).join("");
  const card=(m,dir)=>{
    const other=dir==="in"?m.from:m.to;
    const intNote=m.rInt>0?`<span class="pill warn">Penerima ada intransit ${f0(m.rInt)} ctn</span>`:`<span class="pill muted">Penerima tanpa intransit</span>`;
    const sNote=m.sAp>0?`<span>Pengirim DOI <b>${f0(m.sBefore)}→${f0(m.sAfter)}</b></span>`:`<span>Pengirim tanpa penjualan</span>`;
    return `<div class="card item"><div class="move"><div class="qty">${f0(m.q)}<small>CTN</small></div>
      <div style="min-width:0"><div class="name">${esc(m.sku)}</div>
      <div class="route">${f1(m.rSoh)} ctn di penerima</div></div></div>
      <div class="facts"><span>Penerima DOI <b>${f0(m.rBefore)}→${f0(m.rAfter)}</b></span>${sNote}</div>
      <div class="row">${intNote}${m.sInt>0?`<span class="pill muted">Pengirim ada intransit ${f0(m.sInt)}</span>`:""}</div></div>`};
  const grp=(list,key,dir)=>BRS().filter(b=>list.some(m=>m[key]===b)).map(b=>{const g=list.filter(m=>m[key]===b).sort((x,y)=>y.q-x.q);
    return `<div class="row" style="justify-content:space-between;margin:18px 0 8px"><span class="lbl" style="font-size:15px;color:var(--ink)">ANCAB ${dir==="in"?"DARI":"KE"} ${BN[b].toUpperCase()}</span><span class="pill">${g.length} item · ${f0(g.reduce((s,x)=>s+x.q,0))} ctn</span></div><div class="stack">${g.map(m=>card(m,dir)).join("")}</div>`}).join("");
  const um=unmet.filter(u=>u.b===S.br).sort((a,c)=>c.ap-a.ap);
  const umHtml=um.map(u=>`<div class="card item"><div class="top"><div style="min-width:0"><div class="name">${esc(u.sku)}</div><div class="brand">${esc(u.why)}</div></div><div class="doi ${sev(u.d)}">${u.soh<=0.05?"0":f0(u.d)}<small>HARI DOI</small></div></div>
    <div class="row">${intPill(u.int)}<span class="facts"><span>AP3M <b>${f1(u.ap)}</b>/bln</span></span></div></div>`).join("");
  return `
  <h2>Saran Ancab</h2>
  <div class="chips" role="group" aria-label="Cabang">${chips}</div>
  <div class="card" style="margin-block:12px"><div class="grid2">
    <div class="stat"><span class="v">${f0(sum(inn))}</span><span class="k">ctn diterima · ${inn.length} item</span></div>
    <div class="stat"><span class="v">${f0(sum(out))}</span><span class="k">ctn dikirim · ${out.length} item</span></div></div>
    <p class="note" style="margin:10px 0 0">${RG().rule} Pengirim tetap punya minimal <b>${S.keep}</b> hari, penerima ditambah maksimal <b>${S.add}</b> hari. Intransit tidak dihitung sebagai stok.</p>
    <div class="row" style="margin-top:10px">
      <label class="note" for="keep">Sisa pengirim</label><input type="number" id="keep" value="${S.keep}" min="0" max="120" inputmode="numeric">
      <label class="note" for="add">Tambah</label><input type="number" id="add" value="${S.add}" min="1" max="120" inputmode="numeric"><span class="note">hari</span>
      <label class="row note" style="gap:6px;flex-basis:100%"><input type="checkbox" id="prun" ${S.prun?"checked":""}> Sertakan item PRUNNING</label></div></div>
  ${grp(inn,"from","in")}
  ${grp(out,"to","out")}
  ${!inn.length&&!out.length?'<div class="card empty">Tidak ada Ancab untuk cabang ini.</div>':""}
  ${(inn.length||out.length)?`<button class="btn ghost" id="copy" style="margin-top:14px;width:100%">Salin ringkasan untuk WhatsApp</button>`:""}
  ${um.length?`<div class="lbl" style="margin:20px 0 8px">Belum tertutup Ancab</div><div class="stack">${umHtml}</div>`:""}`;
}

function paintHead(){
  $("#stamp").textContent=S.label;
  document.querySelectorAll(".segb").forEach(b=>b.setAttribute("aria-pressed",b.dataset.cat?b.dataset.cat===S.cat:b.dataset.reg===S.reg));
  $("#sub").textContent=CN[S.cat]+" · "+BRS().map(b=>BN[b]).join(" · ");
}
function render(){fixBr();
  paintHead();
  $("#view").innerHTML=S.tab==="data"?vData():S.tab==="doi"?vDoi():vAncab();
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",t.dataset.tab===S.tab));
  window.scrollTo(0,0);
}
function refresh(){fixBr();const y=window.scrollY;paintHead();$("#view").innerHTML=S.tab==="data"?vData():S.tab==="doi"?vDoi():vAncab();window.scrollTo(0,y)}

document.addEventListener("click",e=>{
  const t=e.target.closest(".tab");if(t){S.tab=t.dataset.tab;render();return}
  const tp=e.target.closest(".item.tap");if(tp&&!e.target.closest("a,button,input,select")){const k=tp.dataset.k;S.open[k]=!S.open[k];refresh();return}
  const sg=e.target.closest(".segb");if(sg){if(sg.dataset.reg)S.reg=sg.dataset.reg;else S.cat=sg.dataset.cat;refresh();return}
  const c=e.target.closest(".chip");if(c){S.br=c.dataset.br;refresh();return}
  if(e.target.id==="pull"){e.target.disabled=true;e.target.textContent="Menarik ...";pullLatest(true).finally(()=>{const b=$("#pull");if(b){b.disabled=false;b.textContent="Tarik data terbaru"}});return}
  if(e.target.id==="reset"){location.reload();return}
  if(e.target.id==="copy"){
    const {moves}=compute();const L=[`Ancab ${BN[S.br]} - ${CN[S.cat]} (data ${S.label})`];
    const inn=moves.filter(m=>m.to===S.br),out=moves.filter(m=>m.from===S.br);
    BRS().forEach(b=>{const g=inn.filter(m=>m.from===b);if(g.length){L.push("","ANCAB DARI "+BN[b].toUpperCase()+":");g.forEach(m=>L.push("- "+m.sku+": "+f0(m.q)+" ctn"))}});
    BRS().forEach(b=>{const g=out.filter(m=>m.to===b);if(g.length){L.push("","ANCAB KE "+BN[b].toUpperCase()+":");g.forEach(m=>L.push("- "+m.sku+": "+f0(m.q)+" ctn"))}});
    const txt=L.join("\n");
    (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast("Ringkasan tersalin")).catch(()=>{const ta=document.createElement("textarea");ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");toast("Ringkasan tersalin")}catch(x){toast("Gagal menyalin")}ta.remove()});
  }
});
document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.classList&&e.target.classList.contains("tap")){e.preventDefault();e.target.click()}});
document.addEventListener("change",e=>{
  const id=e.target.id;
  if(id==="thr"){S.thr=Math.max(1,+e.target.value||30);refresh()}
  else if(id==="sort"){S.sort=e.target.value;refresh()}
  else if(id==="act"){S.active=e.target.checked;refresh()}
  else if(id==="prun"){S.prun=e.target.checked;refresh()}
  else if(id==="keep"){S.keep=Math.max(0,+e.target.value||0);refresh()}
  else if(id==="add"){S.add=Math.max(1,+e.target.value||30);refresh()}
  else if(id==="file"){loadFile(e.target.files[0])}
});

async function loadFile(f){
  const msg=$("#msg");if(!f)return;
  if(typeof XLSX==="undefined"){msg.textContent="Pembaca Excel belum termuat. Cek koneksi lalu muat ulang halaman.";return}
  msg.textContent="Membaca "+f.name+" ...";
  try{
    const buf=await f.arrayBuffer();
    let wb=XLSX.read(buf,{type:"array",sheets:"Update Stock"});
    let ws=wb.Sheets["Update Stock"];
    if(!ws){wb=XLSX.read(buf,{type:"array"});ws=wb.Sheets["Update Stock"]}
    if(!ws){msg.textContent="Sheet 'Update Stock' tidak ditemukan di file ini.";return}
    const a=XLSX.utils.sheet_to_json(ws,{header:1,defval:null,raw:true});
    const map={"MAKASSAR":"MAKASSAR","BONE":"BONE","PARE-PARE":"PAREPARE","PAREPARE":"PAREPARE","PALOPO":"PALOPO","MANADO":"MANADO","GORONTALO":"GORONTALO"};
    const rows=[];
    a.forEach(r=>{const b=map[String(r[1]||"").trim().toUpperCase()];
      const cat=String(r[2]||"").trim().toUpperCase();
      if(b&&(cat==="TRADITIONAL"||cat==="MODERN"))
        rows.push({b,code:String(r[4]||""),sku:String(r[6]||"").trim(),brand:String(r[3]||"").trim(),st:String(r[7]||"").trim().toUpperCase(),
          soh:+r[11]||0,int:+r[13]||0,ap:+r[23]||0,cat})});
    if(!rows.length){msg.textContent="Tidak ada baris Traditional atau Modern untuk 4 cabang. Pastikan ini file Update Stock Nutrifood.";return}
    let label=f.name.replace(/\.[^.]+$/,"");
    for(let i=0;i<5&&i<a.length;i++){const t=String(a[i][1]||"");const m=t.match(/Stock Nutrifood\s+(.+)/i);if(m){label=m[1].trim();break}}
    S.rows=rows;S.label=label;S.src=f.name;S.mod="diunggah";
    render();toast("Data "+label+" dimuat: "+rows.length+" baris");
  }catch(err){msg.textContent="Gagal membaca file: "+(err&&err.message?err.message:err)}
}
render();
/* Muat data terbaru hasil tarikan server (stok-data.json) */
async function pullLatest(manual){
  const set=t=>{const el=$("#auto");if(el)el.textContent=t};
  try{
    const r=await fetch("stok-data.json?t="+Date.now(),{cache:"no-store"});
    if(!r.ok)throw new Error(r.status);
    const j=await r.json();
    if(!j.rows||!j.rows.length)throw new Error("kosong");
    S.rows=j.rows.map(a=>({b:a[0],code:a[1],sku:a[2],brand:a[3],st:a[4],soh:a[5],int:a[6],ap:a[7],cat:a[8]||"TRADITIONAL"}));
    S.label=j.label;S.src=j.src;
    S.mod=new Date(j.modified).toLocaleString("id-ID",{timeZone:"Asia/Makassar",day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"})+" WITA";
    refresh();set((manual?"Ditarik ":"Dimuat otomatis ")+new Date().toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"})+". Server mengecek Nextcloud tiap 10 menit.");
    if(manual)toast("Data "+j.label+" dimuat");
  }catch(e){set("Pakai data bawaan "+SNAP.label+". Data otomatis belum tersedia.");if(manual)toast("Gagal menarik data")}
}
pullLatest(false);
</script>
<script>
/* Wajib pasang di HP: halaman hanya terbuka penuh dalam mode aplikasi */
(function(){
  var ua=navigator.userAgent;
  var ios=/iPhone|iPad|iPod/i.test(ua)||(navigator.maxTouchPoints>1&&/Macintosh/.test(ua));
  var mobile=ios||/Android/i.test(ua);
  var standalone=(window.matchMedia&&matchMedia("(display-mode: standalone)").matches)||navigator.standalone===true;
  if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw-stok.js").catch(function(){})})}
  if(!mobile||standalone)return;
  document.documentElement.classList.add("locked");
  var g=document.getElementById("gate"),btn=document.getElementById("gate-install"),steps=document.getElementById("gate-steps"),done=document.getElementById("gate-done");
  g.hidden=false;
  var inapp=/FBAN|FBAV|Instagram|Line\/|MicroMessenger|WhatsApp|; wv\)/i.test(ua);
  function show(list){steps.innerHTML=list.map(function(s){return "<li>"+s+"</li>"}).join("")}
  var manual=ios?["Buka halaman ini di <b>Safari</b>.","Ketuk tombol <b>Bagikan</b> (kotak dengan panah ke atas).","Pilih <b>Tambah ke Layar Utama</b>, lalu <b>Tambah</b>.","Buka aplikasi dari ikon di layar utama."]
    :["Buka halaman ini di <b>Chrome</b>.","Ketuk menu <b>⋮</b> di pojok kanan atas.","Pilih <b>Instal aplikasi</b> atau <b>Tambahkan ke layar utama</b>.","Buka aplikasi dari ikon di layar utama."];
  if(inapp)manual.unshift("Halaman ini terbuka di dalam aplikasi lain. Salin link-nya dan buka di "+(ios?"Safari":"Chrome")+".");
  var dp=null;
  if(ios){btn.hidden=true;show(manual)}
  else{
    show(manual);
    window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();dp=e;steps.innerHTML=""});
    btn.addEventListener("click",function(){
      if(!dp){steps.scrollIntoView({block:"center"});return}
      dp.prompt();dp.userChoice.then(function(c){dp=null;if(c&&c.outcome==="accepted"){btn.hidden=true;steps.innerHTML="";done.hidden=false}})
    });
    window.addEventListener("appinstalled",function(){btn.hidden=true;steps.innerHTML="";done.hidden=false});
  }
})();
</script>
