<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1E2025">
<title>Stok Gimmick Sehat Indah</title>
<link rel="manifest" href="manifest-gimmick.webmanifest">
<link rel="icon" href="gimmick-192.png">
<link rel="apple-touch-icon" href="gimmick-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gimmick SHI">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#F5F6F8;--surface:#fff;--ink:#16181D;--muted:#8A8F98;--line:#ECEEF2;--graphite:#1E2025;--rack:#FF6A3D;--ok:#1F9D63;--ok-soft:#E3F6EC;--crit:#E5484D;--crit-soft:#FDECEC;color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:0 16px 88px}
.wrap{max-width:640px;margin:0 auto}
header{position:sticky;top:0;z-index:5;background:var(--graphite);color:#fff;margin:0 -16px;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 12px}
header h1{margin:0;font-size:22px;letter-spacing:.02em;text-transform:uppercase}
header .sub{font-size:12px;color:#A9B6C1;margin-top:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:12px}
label{display:block;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:10px 0 4px}
label:first-child{margin-top:0}
input,select{width:100%;font:inherit;padding:11px 12px;border:1.5px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
input:focus,select:focus{outline:2px solid var(--rack);outline-offset:-1px}
button{font:inherit;font-weight:800;border:0;border-radius:10px;padding:13px 14px;cursor:pointer}
.go{width:100%;margin-top:14px;background:var(--rack);color:#1A0E05;font-size:16px}
.go.out{background:var(--graphite);color:#fff}
.go:disabled{opacity:.6;cursor:progress}
.row{display:flex;gap:10px}.row>*{flex:1}
.msg{margin-top:10px;font-size:14px}.msg.ok{color:var(--ok)}.msg.err{color:var(--crit)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:right}
th:first-child,td:first-child{text-align:left}
th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
td.sisa{font-weight:800}td.low{color:var(--crit)}
.pill{display:inline-block;font-size:11px;font-weight:800;padding:2px 8px;border-radius:99px}
.pill.in{background:var(--ok-soft);color:var(--ok)}.pill.out{background:var(--crit-soft);color:var(--crit)}
.h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.h:last-child{border:0}.h small{color:var(--muted);display:block}
.h .del{background:none;color:var(--muted);padding:2px 8px;font-size:18px;font-weight:400}
.h.done{background:var(--ok-soft);margin:0 -14px;padding-left:14px;padding-right:14px}
.ck{width:auto;flex:none;margin:2px 10px 0 0;accent-color:var(--ok);width:22px;height:22px;cursor:pointer}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border-radius:0;padding:14px 4px;font-size:13px;color:var(--muted)}
nav button[aria-selected=true]{color:var(--ink);box-shadow:inset 0 3px 0 var(--rack)}
.kpi{display:flex;gap:10px;margin-top:12px}.kpi div{flex:1;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.kpi b{display:block;font-size:20px}.kpi span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.empty{color:var(--muted);text-align:center;padding:18px 0}
</style>
</head>
<body>
<div class="wrap">
<header><h1>Stok Gimmick</h1><div class="sub">Sehat Indah · barang masuk, keluar, dan sisa (pcs)</div></header>
<div class="card" id="pasang" hidden>
  <b>Pasang di HP</b><div class="msg" id="pasang-info" style="color:var(--muted)">Pasang sekali, lalu buka dari ikon di layar utama.</div>
  <button class="go" id="pasang-btn" type="button" hidden style="margin-top:10px">Pasang aplikasi</button>
</div>

<section id="v-in" class="view"></section>
<section id="v-out" class="view" hidden></section>
<section id="v-stok" class="view" hidden></section>
<section id="v-riwayat" class="view" hidden></section>
</div>
<nav role="tablist" aria-label="Menu">
  <button role="tab" data-v="in" aria-selected="true">Input</button>
  <button role="tab" data-v="out" aria-selected="false">Output</button>
  <button role="tab" data-v="stok" aria-selected="false">Stok</button>
  <button role="tab" data-v="riwayat" aria-selected="false">Riwayat</button>
</nav>

<script>
firebase.initializeApp({apiKey:"AIzaSyCA8Q8athqYIsY3By5wPxcU97GjDBR6DAs",authDomain:"mds-sulawesi.firebaseapp.com",projectId:"mds-sulawesi",storageBucket:"mds-sulawesi.firebasestorage.app",messagingSenderId:"511949021685",appId:"1:511949021685:web:bc32007af0555449e7c0bc"});
var COL=firebase.firestore().collection('stokGimmickSHI');
var TX=[];                       // semua transaksi, terbaru dulu
var NAMA_AWAL=['Abdul','Apin','Adit','Rio','Yayu','Dewi','Yana','Fahri'];
var NAMA_DB=[];                  // nama tambahan yang tersimpan di database (dokumen tipe 'nama')
var cap=function(s){return norm(s).toLowerCase().replace(/(^|\s)\S/g,function(c){return c.toUpperCase()})};
function daftarNama(){var seen={},out=[];NAMA_AWAL.concat(NAMA_DB,TX.map(function(t){return t.pengambil})).forEach(function(n){n=norm(n);if(n&&!seen[key(n)]){seen[key(n)]=1;out.push(n)}});return out;}
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var today=function(){var d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
var norm=function(s){return String(s||'').replace(/\s+/g,' ').trim()};
var key=function(s){return norm(s).toUpperCase()};
var fmt=function(n){return Number(n).toLocaleString('id-ID')};
var fmtTgl=function(t){return new Date(t+'T12:00:00').toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'})};

function saldo(){                // {KEY:{nama,masuk,keluar}}
  var m={};
  TX.forEach(function(t){var k=key(t.item);if(!k)return;var o=m[k]||(m[k]={nama:norm(t.item),masuk:0,keluar:0});
    if(t.tipe==='in')o.masuk+=t.qty;else o.keluar+=t.qty;});
  return m;
}

function formHtml(tipe){
  var out=tipe==='out';
  return '<div class="card"><label>Tanggal</label><input type="date" id="'+tipe+'-tgl" value="'+today()+'">'+
    '<label>Nama item gimmick</label><input id="'+tipe+'-item" list="dl-item" placeholder="mis. Payung Nutrisari" autocomplete="off">'+
    '<label>Qty (pcs)</label><input id="'+tipe+'-qty" type="number" inputmode="numeric" min="1" step="1" placeholder="0">'+
    (out?'<label>Diambil oleh</label><select id="out-pic"></select><input id="out-pic-baru" placeholder="Ketik nama baru" style="margin-top:6px" hidden>':'')+
    '<label>Catatan (opsional)</label><input id="'+tipe+'-cat" placeholder="'+(out?'Tujuan / toko / PIC':'Asal / no. dokumen')+'">'+
    '<div id="'+tipe+'-info" class="msg" style="color:var(--muted)"></div>'+
    '<button class="go'+(out?' out':'')+'" id="'+tipe+'-go">'+(out?'Simpan barang keluar':'Simpan barang masuk')+'</button>'+
    '<div id="'+tipe+'-msg" class="msg"></div></div>';
}

function render(){
  var s=saldo(),keys=Object.keys(s).sort();
  var dl='<datalist id="dl-item">'+keys.map(function(k){return '<option value="'+esc(s[k].nama)+'">'}).join('')+'</datalist>';
  // forms (dirender sekali; datalist diperbarui terpisah)
  if(!$('#in-go')){$('#v-in').innerHTML=formHtml('in');$('#v-out').innerHTML=formHtml('out');bindForm('in');bindForm('out');}
  var old=$('#dl-item');if(old)old.remove();document.body.insertAdjacentHTML('beforeend',dl);
  // stok
  var tm=0,tk=0,ts=0;
  keys.forEach(function(k){tm+=s[k].masuk;tk+=s[k].keluar;ts+=s[k].masuk-s[k].keluar;});
  $('#v-stok').innerHTML='<div class="kpi"><div><b>'+fmt(tm)+'</b><span>Masuk</span></div><div><b>'+fmt(tk)+'</b><span>Keluar</span></div><div><b>'+fmt(ts)+'</b><span>Sisa</span></div></div>'+
    '<div class="card">'+(keys.length?'<table><thead><tr><th>Item</th><th>Masuk</th><th>Keluar</th><th>Sisa</th></tr></thead><tbody>'+
    keys.map(function(k){var o=s[k],sisa=o.masuk-o.keluar;return '<tr><td>'+esc(o.nama)+'</td><td>'+fmt(o.masuk)+'</td><td>'+fmt(o.keluar)+'</td><td class="sisa'+(sisa<=0?' low':'')+'">'+fmt(sisa)+'</td></tr>'}).join('')+
    '</tbody></table>':'<div class="empty">Belum ada data. Mulai dari tab Input.</div>')+'</div>'+pengambilHtml();
  // riwayat
  $('#v-riwayat').innerHTML='<div class="card">'+(TX.length?TX.slice(0,200).map(function(t){
    var out=t.tipe==='out';
    return '<div class="h'+(out&&t.diambil?' done':'')+'">'+(out?'<input type="checkbox" class="ck" data-id="'+esc(t.id)+'" aria-label="Sudah diambil"'+(t.diambil?' checked':'')+'>':'')+'<div style="flex:1"><span class="pill '+t.tipe+'">'+(t.tipe==='in'?'MASUK':'KELUAR')+'</span> <b>'+esc(t.item)+'</b><small>'+fmtTgl(t.tanggal)+(t.tipe==='out'&&t.pengambil?' · diambil '+esc(t.pengambil):'')+(t.catatan?' · '+esc(t.catatan):'')+'</small></div>'+
      '<div style="text-align:right"><b>'+(t.tipe==='in'?'+':'−')+fmt(t.qty)+' pcs</b><br><button class="del" data-id="'+esc(t.id)+'" aria-label="Hapus">×</button></div></div>';}).join(''):'<div class="empty">Belum ada transaksi.</div>')+'</div>';
  fillPic();
  ['in','out'].forEach(showInfo);
}
function fillPic(){
  var sel=$('#out-pic');if(!sel)return;var cur=sel.value;
  sel.innerHTML='<option value="">Pilih nama pengambil</option>'+daftarNama().map(function(n){return '<option>'+esc(n)+'</option>'}).join('')+'<option value="__baru">➕ Tambah nama baru...</option>';
  if(cur&&Array.prototype.some.call(sel.options,function(o){return o.value===cur}))sel.value=cur;
}

function pengambilHtml(){
  var m={};TX.forEach(function(t){if(t.tipe!=='out')return;var n=norm(t.pengambil)||'(tanpa nama)',k=key(n);var o=m[k]||(m[k]={nama:n,qty:0,n:0});o.qty+=t.qty;o.n++;});
  var ks=Object.keys(m).sort(function(a,b){return m[b].qty-m[a].qty});if(!ks.length)return '';
  return '<div class="card"><label>Barang keluar per pengambil</label><table><thead><tr><th>Nama</th><th>Kali</th><th>Total pcs</th></tr></thead><tbody>'+ks.map(function(k){return '<tr><td>'+esc(m[k].nama)+'</td><td>'+m[k].n+'</td><td class="sisa">'+fmt(m[k].qty)+'</td></tr>'}).join('')+'</tbody></table></div>';
}
function showInfo(tipe){
  var el=$('#'+tipe+'-info'),it=$('#'+tipe+'-item');if(!el||!it)return;
  var o=saldo()[key(it.value)];
  el.textContent=o?'Sisa saat ini: '+fmt(o.masuk-o.keluar)+' pcs':(tipe==='out'&&norm(it.value)?'Item belum pernah dicatat masuk.':'');
}

function bindForm(tipe){
  $('#'+tipe+'-item').addEventListener('input',function(){showInfo(tipe)});
  $('#'+tipe+'-go').addEventListener('click',function(){save(tipe)});
  if(tipe==='out')$('#out-pic').addEventListener('change',function(){var b=$('#out-pic-baru');b.hidden=this.value!=='__baru';if(!b.hidden)b.focus();});
}

function save(tipe){
  var btn=$('#'+tipe+'-go'),msg=$('#'+tipe+'-msg');
  var item=norm($('#'+tipe+'-item').value),qty=parseInt($('#'+tipe+'-qty').value,10),tgl=$('#'+tipe+'-tgl').value,cat=norm($('#'+tipe+'-cat').value);
  function err(t){msg.className='msg err';msg.textContent=t;}
  if(!item)return err('Nama item wajib diisi.');
  if(!(qty>=1))return err('Qty harus angka 1 atau lebih.');
  if(!tgl)return err('Tanggal wajib diisi.');
  var pic='';
  if(tipe==='out'){
    var v=$('#out-pic').value;pic=v==='__baru'?cap($('#out-pic-baru').value):v;
    if(!pic)return err('Pilih atau isi nama pengambil.');
    var sama=daftarNama().filter(function(n){return key(n)===key(pic)})[0];if(sama)pic=sama;
  }
  if(tipe==='out'){
    var o=saldo()[key(item)],sisa=o?o.masuk-o.keluar:0;
    if(qty>sisa&&!confirm('Qty keluar ('+fmt(qty)+') lebih besar dari sisa ('+fmt(sisa)+' pcs). Tetap simpan?'))return;
  }
  // samakan penulisan dengan item yang sudah ada (huruf besar/kecil)
  var ada=saldo()[key(item)];if(ada)item=ada.nama;
  btn.disabled=true;msg.className='msg';msg.textContent='Menyimpan...';
  var baru=tipe==='out'&&!daftarNama().some(function(n){return key(n)===key(pic)});
  var rec={tipe:tipe,item:item,qty:qty,tanggal:tgl,catatan:cat,ts:firebase.firestore.FieldValue.serverTimestamp()};
  if(tipe==='out')rec.pengambil=pic;
  var tulis=COL.add(rec);
  if(baru)tulis=tulis.then(function(){return COL.add({tipe:'nama',nama:pic,ts:firebase.firestore.FieldValue.serverTimestamp()})});   // nama baru ikut tersimpan di database
  tulis.then(function(){
    msg.className='msg ok';msg.textContent='Tersimpan: '+item+' '+(tipe==='in'?'+':'−')+fmt(qty)+' pcs';
    $('#'+tipe+'-qty').value='';$('#'+tipe+'-cat').value='';if(tipe==='out'){$('#out-pic-baru').value='';$('#out-pic-baru').hidden=true;$('#out-pic').value=''}btn.disabled=false;
  }).catch(function(e){err('Gagal menyimpan: '+(e.code||'')+' '+e.message);btn.disabled=false;});
}

document.addEventListener('change',function(e){      // centang = barang keluar sudah diambil (hanya tampilan, tidak mengubah stok)
  var c=e.target;if(!c.classList||!c.classList.contains('ck'))return;
  COL.doc(c.dataset.id).update({diambil:c.checked}).catch(function(er){c.checked=!c.checked;alert('Gagal menyimpan centang: '+er.message)});
});
document.addEventListener('click',function(e){
  var d=e.target.closest&&e.target.closest('.del');
  if(d){var t=TX.filter(function(x){return x.id===d.dataset.id})[0];
    if(t&&confirm('Hapus transaksi ini?\n'+(t.tipe==='in'?'Masuk ':'Keluar ')+t.item+' '+fmt(t.qty)+' pcs ('+fmtTgl(t.tanggal)+')'))COL.doc(t.id).delete().catch(function(er){alert('Gagal menghapus: '+er.message)});}
  var b=e.target.closest&&e.target.closest('nav button');
  if(b){document.querySelectorAll('nav button').forEach(function(x){x.setAttribute('aria-selected',x===b)});
    document.querySelectorAll('.view').forEach(function(v){v.hidden=v.id!=='v-'+b.dataset.v});window.scrollTo(0,0);}
});

/* Pasang di HP (PWA): tombol di Android/Chrome, petunjuk di iPhone dan browser lain. Sembunyi kalau sudah dibuka dari ikon. */
(function(){
  var box=$('#pasang'),btn=$('#pasang-btn'),info=$('#pasang-info');
  var standalone=window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw-gimmick.js',{scope:'./stok-gimmick.html'}).catch(function(){});
  if(standalone)return;
  var ios=/iphone|ipad|ipod/i.test(navigator.userAgent),evt=null;
  box.hidden=false;
  info.textContent=ios?'Di iPhone: buka lewat Safari, tekan tombol Bagikan (kotak dengan panah), lalu pilih "Tambah ke Layar Utama".':'Di Android: buka menu ⋮ di Chrome lalu pilih "Instal aplikasi" atau "Tambahkan ke layar utama".';
  window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();evt=e;btn.hidden=false;info.textContent='Pasang sekali, lalu buka dari ikon di layar utama.'});
  btn.addEventListener('click',function(){if(!evt)return;evt.prompt();Promise.resolve(evt.userChoice).catch(function(){}).then(function(){evt=null;btn.hidden=true})});
  window.addEventListener('appinstalled',function(){box.hidden=true});
})();

render();
COL.onSnapshot(function(snap){
  NAMA_DB=snap.docs.map(function(d){return d.data()}).filter(function(x){return x.tipe==='nama'&&x.nama}).map(function(x){return x.nama});
  TX=snap.docs.filter(function(d){return d.data().tipe!=='nama'}).map(function(d){var x=d.data();return {id:d.id,tipe:x.tipe==='out'?'out':'in',item:x.item||'',pengambil:x.pengambil||'',qty:Number(x.qty)||0,tanggal:x.tanggal||today(),catatan:x.catatan||'',diambil:x.diambil===true,ts:x.ts&&x.ts.toMillis?x.ts.toMillis():Date.now()}})
    .sort(function(a,b){return b.tanggal<a.tanggal?-1:b.tanggal>a.tanggal?1:b.ts-a.ts});
  render();
},function(e){document.querySelector('.wrap').insertAdjacentHTML('beforeend','<div class="card msg err">Gagal memuat data: '+esc(e.code||'')+' '+esc(e.message)+'</div>')});
</script>
</body>
</html>
