<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NOO Radar</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
:root{
  --bg:#0b0f1a; --panel:#131a2b; --panel2:#1a2338; --line:#26314d;
  --text:#e8ecf8; --mute:#8a96b8;
  --red:#ff5d73; --amber:#ffb547; --green:#2ee6a6; --blue:#5b8cff;
  --font:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:radial-gradient(1200px 600px at 80% -10%,#1b2a55 0%,transparent 60%),var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;}
.hidden{display:none!important;}

/* gate */
.gate{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px 16px;max-width:520px;margin:0 auto;}
.gate h1{font-size:34px;font-weight:800;letter-spacing:-.03em;}
.gate h1 span{color:var(--green);}
.gate p{color:var(--mute);margin:6px 0 22px;}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.pick button{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left;transition:.15s;}
.pick button:hover{border-color:var(--green);transform:translateY(-2px);}
.pick b{display:block;font-size:15px;}
.pick small{color:var(--mute);font-size:12px;}
.pw{display:flex;gap:8px;margin-top:6px;}
.pw input{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 14px;color:var(--text);font-size:16px;}
.pw button,.pill-btn{background:var(--green);color:#05261b;font-weight:700;border-radius:12px;padding:0 20px;}
.err{color:var(--red);font-size:13px;margin-top:8px;min-height:18px;}

/* app */
.app{max-width:1100px;margin:0 auto;padding:16px 16px 96px;}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px;}
.brand{font-weight:800;font-size:20px;letter-spacing:-.02em;}
.brand span{color:var(--green);}
.who{color:var(--mute);font-size:12px;}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12px;color:var(--mute);}
.hero{display:grid;grid-template-columns:240px 1fr;gap:16px;align-items:center;background:linear-gradient(135deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:22px;padding:20px;}
.donut{width:200px;height:200px;border-radius:50%;margin:auto;position:relative;}
.donut::after{content:"";position:absolute;inset:26px;background:var(--panel);border-radius:50%;}
.donut .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1;}
.donut .mid b{font-size:38px;line-height:1;}
.donut .mid small{color:var(--mute);font-size:12px;margin-top:4px;}
.legend{display:grid;gap:10px;}
.lg{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.03);border-radius:14px;padding:12px 14px;}
.dot{width:12px;height:12px;border-radius:50%;flex:none;}
.lg .n{font-size:24px;font-weight:700;min-width:70px;}
.lg .l{color:var(--mute);font-size:13px;flex:1;}
.lg .p{font-size:13px;color:var(--mute);}
.sec{margin:22px 0 10px;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);}
.board{display:grid;gap:10px;}
.row{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px;}
.row .h{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.rank{width:28px;height:28px;border-radius:9px;background:var(--panel2);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--mute);}
.row .nm{font-weight:600;flex:1;}
.row .pc{font-weight:800;font-size:18px;}
.bar{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--panel2);}
.bar i{display:block;height:100%;}
.nums{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--mute);}
.nums b{color:var(--text);}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
.tools select,.tools input{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--text);font-size:14px;}
.tools input{flex:1;min-width:160px;}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;}
.chips button{white-space:nowrap;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:13px;color:var(--mute);}
.chips button.on{background:var(--text);color:var(--bg);border-color:var(--text);font-weight:700;}
.stores{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;}
.st{background:var(--panel);border:1px solid var(--line);border-left-width:4px;border-radius:14px;padding:12px 14px;}
.st.belum{border-left-color:var(--red);} .st.visit{border-left-color:var(--amber);} .st.omzet{border-left-color:var(--green);}
.st b{display:block;font-size:14px;}
.st .ad{color:var(--mute);font-size:12px;margin:3px 0 8px;}
.st .meta{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);gap:8px;flex-wrap:wrap;}
.st .meta em{font-style:normal;color:var(--text);}
.more{display:block;margin:14px auto;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 22px;}
.empty{color:var(--mute);text-align:center;padding:40px 0;}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(11,15,26,.92);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;justify-content:center;gap:6px;padding:8px 8px calc(8px + env(safe-area-inset-bottom));}
.nav button{flex:1;max-width:200px;padding:10px;border-radius:12px;font-size:13px;color:var(--mute);}
.nav button.on{background:var(--panel2);color:var(--green);font-weight:700;}
@media(max-width:720px){.hero{grid-template-columns:1fr;} .donut{width:180px;height:180px;}}
</style>
</head>
<body>

<section class="gate" id="gate">
  <h1>NOO <span>Radar</span></h1>
  <p id="gateHint">Pilih cabang untuk melihat pantauan.</p>
  <div class="pick" id="pick"></div>
  <div class="pw hidden" id="pwBox">
    <input type="password" id="pw" placeholder="Password cabang" autocomplete="off">
    <button class="pill-btn" id="pwGo">Masuk</button>
  </div>
  <div class="err" id="err"></div>
</section>

<main class="app hidden" id="app">
  <div class="top">
    <div>
      <div class="brand">NOO <span>Radar</span></div>
      <div class="who" id="who"></div>
    </div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end;">
      <span class="chip" id="period">Periode: —</span>
      <button class="chip" id="refresh">↻ Muat ulang</button>
    </div>
  </div>

  <div id="v-ringkas">
    <div class="hero">
      <div class="donut" id="donut"><div class="mid"><b id="dTotal">0</b><small>total coverage</small></div></div>
      <div class="legend" id="legend"></div>
    </div>
    <div class="sec">Papan peringkat sales</div>
    <div class="board" id="boardTop"></div>
  </div>

  <div id="v-sales" class="hidden">
    <div class="sec">Semua sales — urut % toko beromzet</div>
    <div class="board" id="boardAll"></div>
  </div>

  <div id="v-toko" class="hidden">
    <div class="tools">
      <select id="fSales"><option value="">Semua sales</option></select>
      <input id="fSearch" placeholder="Cari nama toko…">
    </div>
    <div class="chips" id="chips"></div>
    <div class="stores" id="stores"></div>
    <button class="more hidden" id="more">Tampilkan lebih banyak</button>
  </div>
</main>

<nav class="nav hidden" id="nav">
  <button data-v="ringkas" class="on">Ringkasan</button>
  <button data-v="sales">Sales</button>
  <button data-v="toko">Toko</button>
</nav>

<script>
const CABANG_LIST = [
  {nama:'Irfan', area:'Makassar & Bulukumba', key:'irfan_makassar_bulukumba'},
  {nama:'Amri', area:'Bone', key:'amri_bone'},
  {nama:'Dandy', area:'Parepare', key:'dandy_parepare'},
  {nama:'Zul', area:'Palopo', key:'zul_palopo'},
  {nama:'Yusuf', area:'Palu', key:'yusuf_palu'},
  {nama:'Miswar', area:'Poso', key:'miswar_poso'},
  {nama:'Teddy', area:'Gorontalo', key:'teddy_gorontalo'},
  {nama:'Irfan', area:'Kotamobagu', key:'irfan_kotamobagu'},
  {nama:'Nando', area:'Manado', key:'nando_manado'},
  {nama:'Paul', area:'Manado', key:'paul_manado'}
];
const GATE_PASSWORD = '1';
firebase.initializeApp({
  apiKey: "AIzaSyCA8Q8athqYIsY3By5wPxcU97GjDBR6DAs",
  authDomain: "mds-sulawesi.firebaseapp.com",
  projectId: "mds-sulawesi",
  storageBucket: "mds-sulawesi.firebasestorage.app",
  messagingSenderId: "511949021685",
  appId: "1:511949021685:web:bc32007af0555449e7c0bc"
});
const db = firebase.firestore();

const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const COLORS = {belum:'var(--red)', visit:'var(--amber)', omzet:'var(--green)'};
const LABELS = {belum:'Belum divisit', visit:'Divisit, belum omzet', omzet:'Sudah ada omzet'};
const PAGE = 60;

let cabangKey = null, rows = [], statusFilter = '', shown = PAGE;

// ----- gate -----
$('pick').innerHTML = CABANG_LIST.map(c=>`<button data-k="${c.key}"><b>${esc(c.nama)}</b><small>${esc(c.area)}</small></button>`).join('');
$('pick').addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  cabangKey = b.dataset.k;
  const c = CABANG_LIST.find(x=>x.key===cabangKey);
  $('gateHint').textContent = `${c.nama} — ${c.area}`;
  $('pick').classList.add('hidden');
  $('pwBox').classList.remove('hidden');
  $('pw').focus();
});
function tryEnter(){
  if($('pw').value !== GATE_PASSWORD){ $('err').textContent = 'Password salah.'; return; }
  $('gate').classList.add('hidden');
  $('app').classList.remove('hidden');
  $('nav').classList.remove('hidden');
  const c = CABANG_LIST.find(x=>x.key===cabangKey);
  $('who').textContent = `${c.nama} · ${c.area}`;
  load();
}
$('pwGo').addEventListener('click', tryEnter);
$('pw').addEventListener('keydown', e=>{ if(e.key==='Enter') tryEnter(); });

// ----- data (read-only) -----
async function load(){
  $('refresh').textContent = '… memuat';
  try{
    const snap = await db.collection('monitoring_noo').doc(cabangKey).get();
    if(!snap.exists){ rows = []; $('legend').innerHTML = '<div class="empty">Belum ada data di cloud untuk cabang ini.</div>'; render(); return; }
    const d = snap.data();
    const vm = d.visitMap || {};
    rows = (d.masterData||[]).map(m=>{
      const v = vm[m.key] || {};
      const count = v.count||0, omzet = v.omzet||0;
      const ld = v.lastDate ? new Date(v.lastDate.toDate ? v.lastDate.toDate() : v.lastDate) : null;
      return {...m, count, omzet, lastDate: ld && !isNaN(ld) ? ld : null,
        status: count>0 && omzet>0 ? 'omzet' : count>0 ? 'visit' : 'belum'};
    });
    $('period').textContent = 'Periode: ' + (d.periodInfo || '—');
  }catch(e){
    console.error(e);
    $('legend').innerHTML = `<div class="empty">Gagal memuat: ${esc(e.message)}</div>`;
  }
  $('refresh').textContent = '↻ Muat ulang';
  render();
}
$('refresh').addEventListener('click', load);

const covered = () => rows.filter(r=>String(r.visitDay||'').trim()!=='');

function render(){
  const cov = covered();
  const cnt = s => cov.filter(r=>r.status===s).length;
  const t = cov.length || 1;
  const a = cnt('belum'), b = cnt('visit'), c = cnt('omzet');
  $('dTotal').textContent = cov.length;
  const p1 = a/t*100, p2 = p1 + b/t*100;
  $('donut').style.background = cov.length
    ? `conic-gradient(var(--red) 0 ${p1}%, var(--amber) ${p1}% ${p2}%, var(--green) ${p2}% 100%)`
    : 'var(--panel2)';
  $('legend').innerHTML = [['belum',a],['visit',b],['omzet',c]].map(([s,n])=>
    `<div class="lg"><span class="dot" style="background:${COLORS[s]}"></span><span class="n">${n}</span><span class="l">${LABELS[s]}</span><span class="p">${(n/t*100).toFixed(0)}%</span></div>`).join('');

  const by = {};
  cov.forEach(r=>{
    const k = (r.namaSales||'').trim() || '(Tanpa sales)';
    (by[k] = by[k] || {belum:0,visit:0,omzet:0,total:0})[r.status]++;
    by[k].total++;
  });
  const list = Object.entries(by).map(([name,s])=>({name,...s,pct:s.omzet/s.total*100})).sort((x,y)=>y.pct-x.pct);
  const card = (s,i)=>`<div class="row"><div class="h"><span class="rank">${i+1}</span><span class="nm">${esc(s.name)}</span><span class="pc">${s.pct.toFixed(0)}%</span></div>
    <div class="bar"><i style="width:${s.omzet/s.total*100}%;background:var(--green)"></i><i style="width:${s.visit/s.total*100}%;background:var(--amber)"></i><i style="width:${s.belum/s.total*100}%;background:var(--red)"></i></div>
    <div class="nums"><span>Coverage <b>${s.total}</b></span><span>Omzet <b>${s.omzet}</b></span><span>Belum omzet <b>${s.visit}</b></span><span>Belum visit <b>${s.belum}</b></span></div></div>`;
  $('boardTop').innerHTML = list.slice(0,5).map(card).join('') || '<div class="empty">Tidak ada data.</div>';
  $('boardAll').innerHTML = list.map(card).join('') || '<div class="empty">Tidak ada data.</div>';

  const sel = $('fSales'), cur = sel.value;
  sel.innerHTML = '<option value="">Semua sales</option>' + [...new Set(rows.map(r=>r.namaSales).filter(Boolean))].sort().map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join('');
  sel.value = cur;
  renderStores();
}

function renderStores(){
  const q = $('fSearch').value.trim().toUpperCase(), sl = $('fSales').value;
  const f = rows.filter(r=>(!sl||r.namaSales===sl)&&(!statusFilter||r.status===statusFilter)&&(!q||String(r.nama).toUpperCase().includes(q)));
  const base = rows.filter(r=>(!sl||r.namaSales===sl)&&(!q||String(r.nama).toUpperCase().includes(q)));
  const n = s => base.filter(r=>r.status===s).length;
  $('chips').innerHTML = [['', 'Semua', base.length],['belum','Belum visit',n('belum')],['visit','Belum omzet',n('visit')],['omzet','Beromzet',n('omzet')]]
    .map(([v,l,c])=>`<button data-s="${v}" class="${statusFilter===v?'on':''}">${l} · ${c}</button>`).join('');
  $('stores').innerHTML = f.slice(0,shown).map(r=>`<div class="st ${r.status}"><b>${esc(r.nama)}</b><div class="ad">${esc(r.alamat||'—')}</div>
    <div class="meta"><span>${esc(r.namaSales||'—')}</span><span>Visit <em>${r.count}</em></span><span>Omzet <em>${r.omzet>0?'Rp '+Math.round(r.omzet).toLocaleString('id-ID'):'—'}</em></span></div></div>`).join('')
    || '<div class="empty">Tidak ada toko sesuai filter.</div>';
  $('more').classList.toggle('hidden', f.length<=shown);
}
$('chips').addEventListener('click', e=>{ const b=e.target.closest('button'); if(!b) return; statusFilter=b.dataset.s; shown=PAGE; renderStores(); });
$('fSales').addEventListener('change', ()=>{shown=PAGE;renderStores();});
$('fSearch').addEventListener('input', ()=>{shown=PAGE;renderStores();});
$('more').addEventListener('click', ()=>{shown+=PAGE;renderStores();});

$('nav').addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('on',x===b));
  ['ringkas','sales','toko'].forEach(v=>$('v-'+v).classList.toggle('hidden', v!==b.dataset.v));
  window.scrollTo(0,0);
});
</script>
</body>
</html>
