<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wallpaper Reminder</title>
<style>
:root{--bg:#0e1117;--card:#171b24;--line:#2a3040;--text:#eef1f7;--mute:#8b93a7;--accent:#ffd24a;}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;}
.wrap{max-width:900px;margin:0 auto;padding:20px 16px 40px;display:grid;gap:18px;grid-template-columns:1fr;}
@media(min-width:760px){.wrap{grid-template-columns:1fr 300px;align-items:start;}}
h1{font-size:22px;margin:0 0 4px;}
p.sub{margin:0 0 14px;color:var(--mute);font-size:14px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:12px;}
label{font-size:12px;color:var(--mute);letter-spacing:.06em;text-transform:uppercase;display:grid;gap:6px;}
textarea,input,select{background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:11px 12px;font-size:16px;font-family:inherit;width:100%;}
textarea{min-height:110px;resize:vertical;}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.themes{display:flex;gap:8px;flex-wrap:wrap;}
.themes button{width:44px;height:44px;border-radius:12px;border:2px solid transparent;cursor:pointer;}
.themes button.on{border-color:#fff;}
button.go{background:var(--accent);color:#231a00;font-weight:700;border:0;border-radius:12px;padding:14px;font-size:16px;cursor:pointer;}
.prev{display:grid;place-items:center;}
canvas{width:100%;max-width:280px;aspect-ratio:9/19.5;border-radius:26px;border:2px solid var(--line);background:#000;}
.hint{font-size:13px;color:var(--mute);line-height:1.5;}
</style>
</head>
<body>
<div class="wrap">
  <div>
    <h1>Wallpaper Reminder</h1>
    <p class="sub">Tulis reminder, unduh gambarnya, jadikan wallpaper lock screen.</p>
    <div class="card">
      <label>Judul kecil
        <input id="title" value="INGAT!" maxlength="24">
      </label>
      <label>Isi reminder (tiap baris = satu poin)
        <textarea id="body">Bayar listrik tanggal 20
Telepon mama sore ini
Kirim laporan sebelum jam 5</textarea>
      </label>
      <div class="row">
        <label>Ukuran teks
          <select id="size"><option value="1">Sedang</option><option value="1.2">Besar</option><option value="0.85">Kecil</option></select>
        </label>
        <label>Posisi
          <select id="pos"><option value="0.42">Tengah (di bawah jam)</option><option value="0.6">Bawah</option></select>
        </label>
      </div>
      <label>Warna tema
        <div class="themes" id="themes"></div>
      </label>
      <button class="go" id="dl">Unduh PNG</button>
      <div class="hint">Cara pasang di Android: buka file hasil unduhan di Galeri → ⋮ → <b>Setel sebagai wallpaper</b> → pilih <b>Layar kunci</b>. Jam bawaan HP tampil di bagian atas, jadi teks sengaja ditaruh di bawahnya.</div>
    </div>
  </div>
  <div class="prev"><canvas id="cv" width="1080" height="2340"></canvas></div>
</div>

<script>
const THEMES = [
  {bg:['#0f2027','#2c5364'], fg:'#ffffff', ac:'#ffd24a'},
  {bg:['#1a0b2e','#6a1b9a'], fg:'#ffffff', ac:'#ff9ecb'},
  {bg:['#0b1f14','#1f6b43'], fg:'#ffffff', ac:'#b6ff6a'},
  {bg:['#2b0d0d','#b3261e'], fg:'#ffffff', ac:'#ffd9a0'},
  {bg:['#f4efe6','#d9cdb4'], fg:'#1d1a14', ac:'#c2410c'},
  {bg:['#000000','#111111'], fg:'#ffffff', ac:'#ff3b30'}
];
let theme = 0;
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');

$('themes').innerHTML = THEMES.map((t,i)=>`<button data-i="${i}" style="background:linear-gradient(135deg,${t.bg[0]},${t.bg[1]})" class="${i===0?'on':''}" aria-label="Tema ${i+1}"></button>`).join('');
$('themes').addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  theme = +b.dataset.i;
  document.querySelectorAll('#themes button').forEach(x=>x.classList.toggle('on', x===b));
  draw();
});

function wrap(text, maxW){
  const words = text.split(/\s+/), lines = []; let cur = '';
  for(const w of words){
    const test = cur ? cur+' '+w : w;
    if(ctx.measureText(test).width > maxW && cur){ lines.push(cur); cur = w; } else cur = test;
  }
  if(cur) lines.push(cur);
  return lines;
}

function draw(){
  const t = THEMES[theme], W = cv.width, H = cv.height, k = +$('size').value;
  const g = ctx.createLinearGradient(0,0,W,H);
  g.addColorStop(0,t.bg[0]); g.addColorStop(1,t.bg[1]);
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);

  const padX = 90, maxW = W - padX*2;
  let y = H * +$('pos').value;
  ctx.textBaseline = 'top';

  ctx.fillStyle = t.ac;
  ctx.font = `800 ${52*k}px system-ui, 'Segoe UI', Roboto, sans-serif`;
  ctx.fillText(($('title').value||'').toUpperCase(), padX, y);
  y += 52*k + 34;
  ctx.fillRect(padX, y, 120, 8);
  y += 8 + 46;

  const fs = 62*k, lh = fs*1.3;
  ctx.font = `600 ${fs}px system-ui, 'Segoe UI', Roboto, sans-serif`;
  $('body').value.split('\n').map(s=>s.trim()).filter(Boolean).forEach(item=>{
    ctx.fillStyle = t.ac; ctx.fillText('•', padX, y);
    ctx.fillStyle = t.fg;
    wrap(item, maxW - 60).forEach(line=>{ ctx.fillText(line, padX+60, y); y += lh; });
    y += lh*0.35;
  });
}
['title','body','size','pos'].forEach(id=>$(id).addEventListener('input', draw));

$('dl').addEventListener('click', ()=>{
  const a = document.createElement('a');
  a.download = 'wallpaper-reminder.png';
  a.href = cv.toDataURL('image/png');
  a.click();
});
draw();
</script>
</body>
</html>
