<style>
:root{--bg:#F5F6F8;--surface:#fff;--ink:#16181D;--muted:#6B7078;--line:#E3E6EB;--accent:#1E2025;--accent-ink:#fff;--ok:#1F7A4D;--ok-soft:#E3F6EC;--warn-soft:#FFF1D6;--warn:#8A5300;--bad:#B42318;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#121316;--surface:#1B1D22;--ink:#EDEEF0;--muted:#9AA0A9;--line:#2B2E35;--accent:#EDEEF0;--accent-ink:#121316;--ok:#53C58B;--ok-soft:#173326;--warn-soft:#3A2D12;--warn:#F2B552;--bad:#FF8A7A;color-scheme:dark}}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:0 16px 48px;-webkit-text-size-adjust:100%}
.wrap{max-width:760px;margin:0 auto}
button,input,select{font:inherit;color:inherit}
header{padding:16px 0 10px}
h1{font-size:20px;margin:0}
#st{font-size:13px;color:var(--muted);margin-top:2px}
#st.err{color:var(--bad)}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.card b{display:block;font-size:22px;line-height:1.2}
.card span{font-size:12px;color:var(--muted)}
.mds{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.mds button{display:flex;width:100%;justify-content:space-between;align-items:center;gap:8px;border:0;border-top:1px solid var(--line);background:none;padding:0 14px;min-height:48px;text-align:left;cursor:pointer}
.mds button:first-child{border-top:0}
.mds button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.mds small{opacity:.75;white-space:nowrap}
.tools{display:flex;gap:8px;margin:12px 0 8px;flex-wrap:wrap}
.tools input{flex:1 1 180px;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:0 12px;min-height:44px}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:8px;min-height:44px;padding:0 12px;font-size:14px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.cnt{font-size:13px;color:var(--muted);margin:4px 0 8px}
#list{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.toko{display:flex;gap:10px;justify-content:space-between;padding:10px 14px;border-top:1px solid var(--line)}
.toko:first-child{border-top:0}
.n{font-weight:600;color:var(--ink);text-decoration:none;overflow-wrap:anywhere}
.n:hover{text-decoration:underline}
.s{font-size:13px;color:var(--muted);margin-top:2px}
.tag{display:inline-block;font-size:11px;border-radius:4px;padding:1px 6px;margin-right:4px;background:var(--bg);color:var(--muted);vertical-align:1px}
.tag.t{background:var(--warn-soft);color:var(--warn)}
.v{flex:none;align-self:flex-start;font-size:13px;border-radius:999px;padding:3px 10px;background:var(--bg);white-space:nowrap}
.v.mid{background:var(--warn-soft);color:var(--warn)}
.kosong{text-align:center;color:var(--muted);padding:40px 0}
</style>
</head>

const BLN=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const now=new Date(),bulan=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const docId=id=>id.replace(/[^A-Za-z0-9.\-]/g,'_');
const stores=D.map(r=>{const id=r[3].toFixed(5)+','+r[4].toFixed(5)+'|'+r[0];return {doc:docId(id),n:r[0],sc:r[1],sb:r[2],lat:r[3],lon:r[4],m:r[5],t:r[6]}});
const need=s=>s.t?2:1;
let dates={},fm='',ft='',q='';
const done=s=>(dates[s.doc]||[]).filter(d=>d.startsWith(bulan)).length;
const sales=s=>{const a=[];if(s.sc)a.push(esc(s.sc)+' (BCP)');if(s.sb&&s.sb!==s.sc)a.push(esc(s.sb)+' (BSP)');return a.length?'Sales: '+a.join(', '):'Sales: belum ada data'};
const maps=s=>`https://www.google.com/maps/search/?api=1&query=${s.lat},${s.lon}`;

function draw(){
  const c=[0,0,0];stores.forEach(s=>{const d=done(s);c[d>=need(s)?2:d>0?1:0]++});
  $('c0').textContent=c[0];$('c1').textContent=c[1];$('c2').textContent=c[2];
  const ms=[...new Set(stores.map(s=>s.m))].sort();
  $('mds').innerHTML=[['','Semua MDS']].concat(ms.map(m=>[m,m])).map(([m,l])=>{
    const L=stores.filter(s=>!m||s.m===m),b=L.filter(s=>done(s)<need(s)).length;
    return `<button data-m="${esc(m)}" aria-pressed="${fm===m}"><span>${esc(l)}</span><small>${b} belum selesai dari ${L.length}</small></button>`}).join('');
  const list=stores.filter(s=>done(s)<need(s)&&(!fm||s.m===fm)&&(!ft||(ft==='p')===!!s.t)&&(!q||(s.n+' '+s.sc+' '+s.sb+' '+s.m).toLowerCase().includes(q)))
    .sort((a,b)=>a.m.localeCompare(b.m)||done(a)-done(b)||a.n.localeCompare(b.n));
  $('cnt').textContent=`${list.length} toko belum selesai bulan ${BLN[now.getMonth()]} ${now.getFullYear()}`;
  $('list').innerHTML=list.length?list.map(s=>{const d=done(s);
    return `<div class="toko"><div><a class="n" href="${maps(s)}" target="_blank" rel="noopener">${esc(s.n)}</a>
    <div class="s"><span class="tag ${s.t?'t':''}">${s.t?'Pareto · 2x':'Display Wow · 1x'}</span>${esc(s.m)} · ${sales(s)}</div></div>
    <span class="v ${d>0?'mid':''}">${d}/${need(s)}</span></div>`}).join(''):'<p class="kosong">Semua toko di tampilan ini sudah divisit.</p>';
}
$('mds').onclick=e=>{const b=e.target.closest('[data-m]');if(b){fm=b.dataset.m;draw()}};
$('tipe').onclick=e=>{const b=e.target.closest('[data-t]');if(!b)return;ft=b.dataset.t;[...$('tipe').children].forEach(x=>x.setAttribute('aria-pressed',x===b));draw()};
$('q').oninput=e=>{q=e.target.value.trim().toLowerCase();draw()};
