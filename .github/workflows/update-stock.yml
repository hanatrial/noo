name: Update data stok

on:
  schedule:
    # WITA = UTC+8. 09.00-15.00 WITA = 01.00-07.00 UTC, Senin-Sabtu (tanpa Minggu)
    - cron: "*/10 1-6 * * 1-6"
    - cron: "0 7 * * 1-6"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install xlsx@0.18.5 --no-save
      - run: node scripts/fetch-stock.mjs
      - name: Commit jika data berubah
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stok-data.json
          git diff --cached --quiet && echo "Tidak ada perubahan" && exit 0
          git commit -m "Update data stok"
          git push
