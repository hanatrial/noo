name: Update data stok

on:
  schedule:
    - cron: "*/30 1-12 * * *"   # tiap 30 menit, 08.00-19.30 WITA
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install xlsx@0.18.5 --no-save
      - run: node scripts/fetch-stock.mjs
      - name: Commit jika data berubah
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stok-data.json
          git diff --cached --quiet && echo "Tidak ada perubahan" && exit 0
          git commit -m "Update data stok"
          git push
