name: Update data stok

on:
  schedule:
    # WITA = UTC+8. Mulai lebih awal (04.00 WITA) karena GitHub sering menunda jadwal beberapa jam. Senin-Sabtu WITA, selesai 15.00 WITA.
    - cron: "*/10 20-23 * * 0-5"   # 04.00-07.50 WITA (hari UTC sebelumnya)
    - cron: "*/10 0-6 * * 1-6"     # 08.00-14.50 WITA
    - cron: "0 7 * * 1-6"          # 15.00 WITA
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install xlsx@0.18.5 --no-save
      - run: node scripts/fetch-stock.mjs
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' }}
      - name: Commit jika data berubah
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stok-data.json
          git diff --cached --quiet && echo "Tidak ada perubahan" && exit 0
          git commit -m "Update data stok"
          git push
